<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>死亡之屋 · 复刻版 — 第一章</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas {
    width:  min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    cursor: none;
    touch-action: none;
    image-rendering: auto;
    background:#000;
  }
</style>

<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ============================================================
   死亡之屋 · 复刻版 (THE HOUSE OF THE DEAD — homage remake)
   第一章「馆」 — 纯 Canvas / WebAudio，零外部资源
   v3：恐怖氛围版 — 黑暗光池 / 噪声做旧 / 尸体持久化 / 阴湿音效
   ============================================================ */

// ---------- 基础 ----------
const W = 960, H = 540, TAU = Math.PI * 2;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const rand  = (a,b)=> a+Math.random()*(b-a);
const pick  = (arr)=> arr[(Math.random()*arr.length)|0];

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = W*dpr; cvs.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
addEventListener('resize', resize);

// 透视：z=0 远处 → z=1 贴脸
function persp(z){
  const p = Math.pow(clamp(z,0,1.05), 1.25);
  return { y: lerp(368, 592, p), k: lerp(0.34, 1.52, p) };
}

// ---------- 音效 (WebAudio 合成) ----------
let actx = null, master = null, muted = false;
function audioInit(){
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.5;
    master.connect(actx.destination);
    startAmbience();
  } catch(e){}
}
function noiseBuf(dur){
  const n = (actx.sampleRate*dur)|0;
  const b = actx.createBuffer(1, n, actx.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return b;
}
function env(g,t0,a,peak,d){
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(peak,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
}
function playNoise(dur, type, f0, f1, peak, decay, when){
  if (!actx || muted) return;
  const t = actx.currentTime + (when||0);
  const src = actx.createBufferSource(); src.buffer = noiseBuf(dur);
  const f = actx.createBiquadFilter(); f.type = type;
  f.frequency.setValueAtTime(f0,t);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+decay);
  const g = actx.createGain(); env(g,t,0.002,peak,decay);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t+dur+0.02);
}
function playTone(type, f0, f1, peak, dur, when){
  if (!actx || muted) return;
  const t = actx.currentTime + (when||0);
  const o = actx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
  const g = actx.createGain(); env(g,t,0.004,peak,dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.05);
}
const sfx = {
  shot(){ playNoise(0.25,'lowpass',8500,400,0.85,0.2,0); playTone('triangle',150,45,0.7,0.13,0); },
  dry(){ playTone('square',900,700,0.15,0.03,0); },
  reload(){ playTone('square',420,300,0.2,0.04,0); playTone('square',650,480,0.25,0.05,0.16);
            playNoise(0.08,'highpass',2500,2500,0.2,0.06,0.3); },
  // 湿黏的击中声
  hit(){ playNoise(0.14,'bandpass',300,140,0.55,0.12,0); playTone('sine',180,70,0.3,0.09,0); },
  head(){ playNoise(0.16,'bandpass',700,200,0.6,0.14,0); playTone('sine',240,60,0.35,0.12,0);
          playNoise(0.3,'lowpass',500,120,0.25,0.26,0.05); },
  ricochet(){ playTone('square',2300,1300,0.2,0.09,0); playNoise(0.06,'highpass',4000,4000,0.15,0.05,0); },
  // 分层喉音：锯齿主体 + 半频次谐波 + 气声尾
  groan(base){ if(!actx||muted) return; const t=actx.currentTime;
    const o=actx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(base,t);
    o.frequency.linearRampToValueAtTime(base*0.68, t+1.1);
    const l=actx.createOscillator(); l.frequency.value=4.7;
    const lg=actx.createGain(); lg.gain.value=base*0.26;
    l.connect(lg); lg.connect(o.frequency);
    const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(480,t);
    f.frequency.linearRampToValueAtTime(220,t+1.1);
    const g=actx.createGain(); env(g,t,0.18,0.15,1.0);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); l.start(t); o.stop(t+1.3); l.stop(t+1.3);
    playTone('sine',base*0.5,base*0.32,0.2,1.0,0.05);
    playNoise(0.6,'bandpass',300,150,0.08,0.5,0.55); },
  scream(){ playTone('sawtooth',700,180,0.25,0.5,0); playNoise(0.4,'bandpass',1200,500,0.2,0.35,0); },
  hurt(){ playTone('sawtooth',300,90,0.4,0.3,0); playNoise(0.2,'lowpass',1200,300,0.4,0.18,0); },
  swing(){ playNoise(0.22,'bandpass',700,2200,0.4,0.2,0); },
  roar(){ if(!actx||muted) return;
    playTone('sawtooth',110,55,0.5,1.1,0); playTone('sawtooth',165,70,0.35,1.1,0.05);
    playNoise(0.9,'lowpass',900,200,0.4,0.8,0); },
  step(){ playNoise(0.09,'lowpass',300,120,0.35,0.08,0); },
  heart(){ playTone('sine',58,40,0.5,0.1,0); playTone('sine',52,36,0.4,0.1,0.18); },
  breath(){ playNoise(0.7,'bandpass',600,350,0.07,0.6,0); },
  coin(){ playTone('square',990,990,0.2,0.08,0); playTone('square',1320,1320,0.2,0.12,0.09); },
  civ(){ playTone('sine',600,880,0.18,0.15,0); playTone('sine',880,660,0.18,0.18,0.18); },
  boom(){ playNoise(0.8,'lowpass',2000,120,0.8,0.7,0); playTone('sine',90,30,0.7,0.6,0); },
  thunder(){ playNoise(1.6,'lowpass',600,60,0.55,1.3,0.12); playTone('sine',70,28,0.4,1.1,0.1); },
  // 不和谐小二度音刺（新一波来袭）
  sting(){ playTone('triangle',87,82,0.3,1.5,0); playTone('triangle',92.5,88,0.24,1.5,0);
           playTone('sine',43.5,40,0.3,1.5,0); playNoise(0.5,'lowpass',420,80,0.28,0.45,0); },
  // 灯光失灵的电流声
  buzz(){ playTone('square',118,112,0.1,0.35,0); playNoise(0.3,'highpass',2800,2800,0.05,0.25,0); },
};
function startAmbience(){
  // 风
  const src = actx.createBufferSource(); src.buffer = noiseBuf(2); src.loop = true;
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=240;
  const g = actx.createGain(); g.gain.value = 0.045;
  const l = actx.createOscillator(); l.frequency.value = 0.13;
  const lg = actx.createGain(); lg.gain.value = 0.022;
  l.connect(lg); lg.connect(g.gain);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(); l.start();
  // 失谐低鸣（dread drone）
  const d1=actx.createOscillator(); d1.type='sawtooth'; d1.frequency.value=41;
  const d2=actx.createOscillator(); d2.type='sawtooth'; d2.frequency.value=41.7;
  const df=actx.createBiquadFilter(); df.type='lowpass'; df.frequency.value=95; df.Q.value=5;
  const dg=actx.createGain(); dg.gain.value=0.05;
  const dl=actx.createOscillator(); dl.frequency.value=0.06;
  const dlg=actx.createGain(); dlg.gain.value=0.024;
  dl.connect(dlg); dlg.connect(dg.gain);
  d1.connect(df); d2.connect(df); df.connect(dg); dg.connect(master);
  d1.start(); d2.start(); dl.start();
}

// ---------- 纹理 / 预渲染工具 ----------
function newCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

// 值噪声贴图（做旧用）
const NOISE = [];
function buildNoise(){
  for (let n=0;n<3;n++){
    const size=128, c=newCanvas(size,size), g=c.getContext('2d');
    const im=g.createImageData(size,size);
    const grid=(s)=>{
      const cnt=s+1, gp=[];
      for (let i=0;i<cnt*cnt;i++) gp.push(Math.random());
      return (x,y)=>{
        const fx=x*s, fy=y*s;
        const x0=Math.min(s-1,fx|0), y0=Math.min(s-1,fy|0);
        const tx=fx-x0, ty=fy-y0;
        const sx=tx*tx*(3-2*tx), sy=ty*ty*(3-2*ty);
        return lerp(lerp(gp[y0*cnt+x0],gp[y0*cnt+x0+1],sx),
                    lerp(gp[(y0+1)*cnt+x0],gp[(y0+1)*cnt+x0+1],sx), sy);
      };
    };
    const o1=grid(4), o2=grid(9), o3=grid(23);
    for (let y=0;y<size;y++) for (let x=0;x<size;x++){
      const u=x/size, v=y/size;
      const val=o1(u,v)*0.5+o2(u,v)*0.3+o3(u,v)*0.2;
      const p=(y*size+x)*4, cc=(val*255)|0;
      im.data[p]=cc; im.data[p+1]=cc; im.data[p+2]=cc; im.data[p+3]=255;
    }
    g.putImageData(im,0,0);
    NOISE.push(c);
  }
}
buildNoise();

// Bayer 有序抖动 + 色阶量化：90 年代渲染的关键质感
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function ditherCanvas(c, q){
  const g=c.getContext('2d');
  const im=g.getImageData(0,0,c.width,c.height), d=im.data;
  for (let y=0;y<c.height;y++) for (let x=0;x<c.width;x++){
    const i=(y*c.width+x)*4;
    if (d[i+3]===0) continue;
    const b=(BAYER[y&3][x&3]/16-0.5)*q;
    d[i]  =clamp((((d[i]  +b)/q)|0)*q,0,255);
    d[i+1]=clamp((((d[i+1]+b)/q)|0)*q,0,255);
    d[i+2]=clamp((((d[i+2]+b)/q)|0)*q,0,255);
  }
  g.putImageData(im,0,0);
}

// 做旧管线：噪声 grime + 边缘暗化(伪AO) + 抖动量化
function texturize(c, opts){
  opts=opts||{};
  const g=c.getContext('2d');
  // 1) 噪声污渍（乘暗一层 + overlay 一层）
  const tmp=newCanvas(c.width,c.height), tg=tmp.getContext('2d');
  tg.drawImage(c,0,0);
  tg.globalCompositeOperation='source-in';
  tg.drawImage(pick(NOISE), rand(-60,0), rand(-60,0), c.width+90, c.height+90);
  g.globalCompositeOperation='multiply';
  g.globalAlpha=opts.grime!==undefined?opts.grime:0.4;
  g.drawImage(tmp,0,0);
  g.globalCompositeOperation='overlay';
  g.globalAlpha=(opts.grime!==undefined?opts.grime:0.4)*0.55;
  g.drawImage(tmp,0,0);
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  // 2) 边缘暗化：腐蚀出内核，边带涂黑压边
  const er=opts.edge!==undefined?opts.edge:4;
  if (er>0){
    const core=newCanvas(c.width,c.height), cg=core.getContext('2d');
    cg.drawImage(c,0,0);
    for (const [ox,oy] of [[er,0],[-er,0],[0,er],[0,-er]]){
      cg.globalCompositeOperation='destination-in';
      cg.drawImage(c,ox,oy);
    }
    const band=newCanvas(c.width,c.height), bg=band.getContext('2d');
    bg.drawImage(c,0,0);
    bg.globalCompositeOperation='destination-out';
    bg.drawImage(core,0,0);
    bg.globalCompositeOperation='source-in';
    bg.fillStyle='#000'; bg.fillRect(0,0,c.width,c.height);
    g.globalAlpha=opts.edgeA!==undefined?opts.edgeA:0.45;
    try{ g.filter='blur(2px)'; }catch(e){}
    g.drawImage(band,0,0);
    try{ g.filter='none'; }catch(e){}
    g.globalAlpha=1;
  }
  // 3) 抖动量化
  ditherCanvas(c, opts.q!==undefined?opts.q:16);
}

// 身体部件：uw/uh 为“单位”尺寸，内部 3 倍超采样，出厂自动做旧
function newPart(uw,uh,fn,texOpts){
  const PS=3, c=newCanvas(Math.ceil(uw*PS),Math.ceil(uh*PS));
  const g=c.getContext('2d'); g.scale(PS,PS);
  g.lineJoin='round'; g.lineCap='round';
  fn(g,uw,uh);
  if (texOpts!==null) texturize(c, texOpts||{});
  c.uw=uw; c.uh=uh; return c;
}
// 斑驳腐皮/污渍
function mottle(g,x,y,w,h,n,cols,r0,r1,a0,a1){
  for (let i=0;i<n;i++){
    g.globalAlpha = rand(a0,a1);
    g.fillStyle = pick(cols);
    g.beginPath();
    g.ellipse(x+Math.random()*w, y+Math.random()*h, rand(r0,r1), rand(r0,r1)*rand(0.5,1), rand(0,TAU), 0, TAU);
    g.fill();
  }
  g.globalAlpha = 1;
}
// 细划痕/裂纹
function cracks(g,x,y,w,h,n,col,a){
  g.strokeStyle=col; g.lineWidth=0.6; g.globalAlpha=a;
  for (let i=0;i<n;i++){
    let px=x+Math.random()*w, py=y+Math.random()*h;
    g.beginPath(); g.moveTo(px,py);
    for (let s=0;s<3;s++){ px+=rand(-4,4); py+=rand(1,4); g.lineTo(px,py); }
    g.stroke();
  }
  g.globalAlpha=1;
}
// 开放性伤口
function gash(g,x,y,w,h,ang){
  g.save(); g.translate(x,y); g.rotate(ang);
  g.fillStyle='#200404';
  g.beginPath(); g.ellipse(0,0,w,h,0,0,TAU); g.fill();
  g.fillStyle='#4e0c0c';
  g.beginPath(); g.ellipse(0,0,w*0.6,h*0.55,0,0,TAU); g.fill();
  g.strokeStyle='rgba(14,3,3,0.8)'; g.lineWidth=0.8;
  g.beginPath(); g.ellipse(0,0,w,h,0,0,TAU); g.stroke();
  g.restore();
}
// 干涸血流
function bloodTrail(g,x,y,len,w){
  g.strokeStyle='#3a0a08'; g.lineWidth=w; g.globalAlpha=0.85;
  g.beginPath(); g.moveTo(x,y);
  let px=x, py=y;
  for (let i=0;i<3;i++){ px+=rand(-1.2,1.2); py+=len/3; g.lineTo(px,py); }
  g.stroke();
  g.fillStyle='#3a0a08';
  g.beginPath(); g.arc(px,py,w*0.9,0,TAU); g.fill();
  g.globalAlpha=1;
}
function vGrad(g,x0,y0,x1,y1,stops){
  const gr=g.createLinearGradient(x0,y0,x1,y1);
  for (const [p,c] of stops) gr.addColorStop(p,c);
  return gr;
}

// ---------- 丧尸部件库（v3：灰败失血的配色） ----------
const SKINS = {
  shambler:{ hi:'#9c9686', mid:'#6a675a', lo:'#37352c', decay:'#565e42' },
  runner:  { hi:'#a68f6e', mid:'#726049', lo:'#3c3226', decay:'#665832' },
  brute:   { hi:'#8b9098', mid:'#585f6a', lo:'#2b303a', decay:'#465250' },
  thrower: { hi:'#92889c', mid:'#635c70', lo:'#332e40', decay:'#524c62' },
  civ:     { hi:'#eccfae', mid:'#d2a682', lo:'#8e684c', decay:'#d2a682' },
};
const JEANS = { hi:'#4d5665', mid:'#37404e', lo:'#222834' };

// 头部 v3：不对称的恐怖脸
// o: {v:0|1, feral, stitched, hood, civ}
function buildHead(p,o){
  o = o||{};
  return newPart(44,58,(g)=>{
    const cx=22, cy=27;
    // 颅骨（瘦长）
    let gr=g.createRadialGradient(cx-6,cy-10,3,cx,cy,23);
    gr.addColorStop(0,p.hi); gr.addColorStop(0.55,p.mid); gr.addColorStop(1,p.lo);
    g.fillStyle=gr;
    g.beginPath(); g.ellipse(cx,cy-2,15.5,20,0,0,TAU); g.fill();
    // 下颚收窄
    g.fillStyle=p.mid;
    g.beginPath(); g.ellipse(cx+(o.v?1.5:-1),cy+12,10,9.5,o.v?0.12:-0.1,0,TAU); g.fill();
    // 颧骨高光 + 脸颊深凹
    g.globalAlpha=0.5; g.fillStyle=p.hi;
    g.beginPath(); g.ellipse(cx-9,cy,3.5,2,0.3,0,TAU); g.fill();
    g.beginPath(); g.ellipse(cx+9,cy,3.5,2,-0.3,0,TAU); g.fill();
    g.globalAlpha=0.65; g.fillStyle=p.lo;
    g.beginPath(); g.ellipse(cx-9.5,cy+5,4,6.5,0.35,0,TAU); g.fill();
    g.beginPath(); g.ellipse(cx+9.5,cy+5,4,6.5,-0.35,0,TAU); g.fill();
    g.globalAlpha=1;
    mottle(g,4,3,36,46,34,[p.lo,p.decay,'#4c4232'],0.8,3,0.08,0.22);
    if (o.civ){
      g.fillStyle='#3a2c1e';
      g.beginPath(); g.ellipse(cx,cy-10,15,10,0,Math.PI,0); g.fill();
      g.beginPath(); g.ellipse(cx-13,cy-4,3,7,0.2,0,TAU); g.fill();
      g.beginPath(); g.ellipse(cx+13,cy-4,3,7,-0.2,0,TAU); g.fill();
      for (const dx of [-6.5,6.5]){
        g.fillStyle='#fff';
        g.beginPath(); g.ellipse(cx+dx,cy-1,3.4,2.6,0,0,TAU); g.fill();
        g.fillStyle='#2a1c10';
        g.beginPath(); g.arc(cx+dx,cy-1,1.5,0,TAU); g.fill();
        g.strokeStyle='#3a2c1e'; g.lineWidth=1.2;
        g.beginPath(); g.moveTo(cx+dx-3.5,cy-5.5); g.lineTo(cx+dx+3.5,cy-6.5); g.stroke();
      }
      g.strokeStyle='#8a5a48'; g.lineWidth=1.4;
      g.beginPath(); g.arc(cx,cy+11,4.5,0.25,Math.PI-0.25); g.stroke();
      return;
    }
    // 眉脊压顶阴影
    g.globalAlpha=0.7; g.fillStyle=p.lo;
    g.beginPath(); g.ellipse(cx,cy-7.5,13.5,4.5,0,0,TAU); g.fill();
    g.globalAlpha=1;
    // ---- 眼睛（不对称是恐怖的核心）----
    const eyePit=(ex,ey,rx,ry)=>{
      const eg=g.createRadialGradient(ex,ey,0.5,ex,ey,rx+1.5);
      eg.addColorStop(0,'#070403'); eg.addColorStop(1,'rgba(7,4,3,0)');
      g.fillStyle=eg;
      g.beginPath(); g.ellipse(ex,ey,rx+1.5,ry+1.5,0,0,TAU); g.fill();
      g.fillStyle='#0a0505';
      g.beginPath(); g.ellipse(ex,ey,rx,ry,0,0,TAU); g.fill();
    };
    const milkyEye=(ex,ey,r,px,py)=>{
      g.fillStyle='#c9c4b0';
      g.beginPath(); g.arc(ex,ey,r,0,TAU); g.fill();
      g.fillStyle='rgba(120,116,100,0.7)';
      g.beginPath(); g.arc(ex+px,ey+py,r*0.42,0,TAU); g.fill();
      g.fillStyle='#33302a';
      g.beginPath(); g.arc(ex+px,ey+py,r*0.18,0,TAU); g.fill();
      // 半垂的眼睑
      g.fillStyle=p.mid;
      g.beginPath(); g.ellipse(ex,ey-r*0.62,r+0.8,r*0.6,0,Math.PI,0); g.fill();
      g.strokeStyle=p.lo; g.lineWidth=0.8;
      g.beginPath(); g.moveTo(ex-r,ey-r*0.34); g.lineTo(ex+r,ey-r*0.34); g.stroke();
    };
    if (o.feral){
      // 疾跑者：布满血丝的暴凸双眼 + 针尖瞳孔
      for (const dx of [-6.8,6.8]){
        g.fillStyle='#d8d2be';
        g.beginPath(); g.arc(cx+dx,cy-2.5,4,0,TAU); g.fill();
        g.strokeStyle='rgba(150,30,20,0.75)'; g.lineWidth=0.5;
        for (let i=0;i<4;i++){
          const a=rand(0,TAU);
          g.beginPath(); g.moveTo(cx+dx+Math.cos(a)*3.8,cy-2.5+Math.sin(a)*3.8);
          g.lineTo(cx+dx+Math.cos(a)*1.2,cy-2.5+Math.sin(a)*1.2); g.stroke();
        }
        g.fillStyle='#0c0a06';
        g.beginPath(); g.arc(cx+dx+rand(-0.6,0.6),cy-2.5,0.9,0,TAU); g.fill();
        g.strokeStyle='#3a1410'; g.lineWidth=1;
        g.beginPath(); g.arc(cx+dx,cy-2.5,4.4,0,TAU); g.stroke();
      }
    } else if (o.stitched){
      // 巨汉：两只浑浊小眼
      milkyEye(cx-7,cy-3,2.6,-0.4,0.3);
      milkyEye(cx+7,cy-3,2.6,0.5,0.2);
    } else if (o.v===1){
      // 变体B：右眼浑浊，左额露出骨板
      eyePit(cx-7,cy-2.5,4.6,4);
      milkyEye(cx+7,cy-2.5,3.6,0.6,0.4);
      bloodTrail(g,cx-7.5,cy+1.5,10,1.4);
      g.fillStyle='#b8b09a';
      g.beginPath(); g.ellipse(cx-7,cy-14,5.5,4,0.3,0,TAU); g.fill();
      g.strokeStyle='#57503e'; g.lineWidth=0.7;
      g.beginPath(); g.moveTo(cx-11,cy-15); g.lineTo(cx-7,cy-13); g.lineTo(cx-4,cy-15.5); g.stroke();
    } else {
      // 变体A：左眼窝空洞淌血，右眼浑浊死鱼眼
      eyePit(cx-7,cy-2.5,4.8,4.2);
      bloodTrail(g,cx-7,cy+2,12,1.6);
      milkyEye(cx+7,cy-2.5,3.8,-0.8,0.5);
    }
    // 塌陷的鼻腔
    g.fillStyle='#140806';
    g.beginPath(); g.moveTo(cx-1.8,cy+6); g.lineTo(cx-0.4,cy+2.5); g.lineTo(cx-0.1,cy+6); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(cx+1.8,cy+6); g.lineTo(cx+0.4,cy+2.5); g.lineTo(cx+0.1,cy+6); g.closePath(); g.fill();
    // ---- 嘴 ----
    if (o.stitched){
      // 缝死的嘴
      g.strokeStyle='#1a0e0a'; g.lineWidth=1.2;
      g.beginPath(); g.moveTo(cx-7,cy+12.5); g.lineTo(cx+7,cy+13.5); g.stroke();
      g.strokeStyle='#4c4232'; g.lineWidth=1;
      for (let i=0;i<5;i++){
        const mx=cx-6+i*3;
        g.beginPath(); g.moveTo(mx,cy+10); g.lineTo(mx+1,cy+16); g.stroke();
      }
    } else if (o.feral){
      // 嘶吼大张的嘴
      g.fillStyle='#120303';
      g.beginPath(); g.ellipse(cx,cy+14,7.5,6.2,0,0,TAU); g.fill();
      g.fillStyle='#b8ac8e';
      for (let i=0;i<5;i++){
        g.save(); g.translate(cx-5.6+i*2.8, cy+9.4); g.rotate(rand(-0.15,0.15));
        g.beginPath(); g.moveTo(-1,0); g.lineTo(1,0); g.lineTo(0,3.4); g.closePath(); g.fill();
        g.restore();
      }
      for (let i=0;i<4;i++){
        g.save(); g.translate(cx-4.2+i*2.8, cy+19); g.rotate(rand(-0.2,0.2));
        g.beginPath(); g.moveTo(-0.9,0); g.lineTo(0.9,0); g.lineTo(0,-2.8); g.closePath(); g.fill();
        g.restore();
      }
      bloodTrail(g,cx+5,cy+17,7,1.2);
    } else {
      // 歪斜半脱臼的下颚 + 稀烂的牙
      g.save(); g.translate(cx+(o.v?-1.5:2),cy+13.5); g.rotate(o.v?-0.12:0.14);
      g.fillStyle='#0e0202';
      g.beginPath(); g.ellipse(0,0,6.8,4.6,0,0,TAU); g.fill();
      g.fillStyle='#a89c7e';
      for (let i=0;i<4;i++){
        if (i===1) continue;
        g.save(); g.translate(-4.2+i*2.9,-3.4); g.rotate(rand(-0.25,0.25));
        g.beginPath(); g.moveTo(-0.9,0); g.lineTo(0.9,0); g.lineTo(0,2.8); g.closePath(); g.fill();
        g.restore();
      }
      g.fillRect(-2.5,2.2,1.8,2.2);
      g.restore();
      bloodTrail(g,cx+(o.v?-4:7),cy+16,8,1.3);
    }
    // 撕裂的脸颊（露牙洞）——变体A限定
    if (!o.feral && !o.stitched && o.v!==1){
      g.fillStyle='#180505';
      g.beginPath();
      g.moveTo(cx+9,cy+4); g.lineTo(cx+14,cy+6.5); g.lineTo(cx+13,cy+11);
      g.lineTo(cx+8.5,cy+10); g.closePath(); g.fill();
      g.fillStyle='#a89c7e';
      g.fillRect(cx+9.5,cy+6,1.4,2); g.fillRect(cx+11.5,cy+6.6,1.4,2);
      g.strokeStyle='#3a0a08'; g.lineWidth=0.8;
      g.beginPath(); g.moveTo(cx+9,cy+4); g.lineTo(cx+14,cy+6.5); g.lineTo(cx+13,cy+11); g.stroke();
    }
    // 头顶撕裂伤 + 裂纹
    gash(g, cx+(o.v?5:-6), cy-15, 5, 2.2, o.v?-0.4:0.5);
    cracks(g, 6, 4, 32, 26, 5, '#2e2a1e', 0.55);
    // 稀疏垂发
    g.strokeStyle='rgba(16,13,10,0.75)'; g.lineWidth=0.8;
    for (let i=0;i<11;i++){
      const hx=cx-13+i*2.5+rand(-1,1);
      if (i>3 && i<7 && Math.random()<0.5) continue;
      g.beginPath(); g.moveTo(hx,cy-17+rand(-2,1));
      g.quadraticCurveTo(hx+rand(-2,2), cy-8, hx+rand(-3,3), cy+rand(-6,2));
      g.stroke();
    }
    if (o.hood){
      // 兜帽：整张脸埋进阴影，只露腐烂的下半
      g.fillStyle=vGrad(g,cx,2,cx,40,[[0,'#3c3446'],[1,'#17131e']]);
      g.beginPath();
      g.moveTo(cx-18,cy+9);
      g.quadraticCurveTo(cx-21,cy-22, cx,cy-25);
      g.quadraticCurveTo(cx+21,cy-22, cx+18,cy+9);
      g.quadraticCurveTo(cx+10,cy+3, cx,cy+3);
      g.quadraticCurveTo(cx-10,cy+3, cx-18,cy+9);
      g.closePath(); g.fill();
      // 帽沿下的深渊
      g.fillStyle='rgba(2,1,3,0.92)';
      g.beginPath(); g.ellipse(cx,cy-3,12,7.5,0,0,TAU); g.fill();
      g.strokeStyle='rgba(8,5,12,0.7)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(cx-12,cy-16); g.quadraticCurveTo(cx-14,cy-4,cx-15,cy+5); g.stroke();
      g.beginPath(); g.moveTo(cx+12,cy-16); g.quadraticCurveTo(cx+14,cy-4,cx+15,cy+5); g.stroke();
    }
    // 轮廓
    g.globalAlpha=0.55; g.strokeStyle='#0e0c09'; g.lineWidth=1.2;
    g.beginPath(); g.ellipse(cx,cy,16,20.4,0,0,TAU); g.stroke();
    g.globalAlpha=1;
  });
}

function buildTorso(p,o){
  o = o||{};
  const uw = o.big ? 76 : 58, uh = 58;
  return newPart(uw,uh,(g)=>{
    const cx=uw/2, shW=o.big?32:25, waW=o.big?24:16, hpW=o.big?27:19;
    g.fillStyle=p.mid; g.fillRect(cx-5,0,10,9);
    const body=()=>{
      g.beginPath();
      g.moveTo(cx-shW,9);
      g.quadraticCurveTo(cx,5,cx+shW,8);
      g.quadraticCurveTo(cx+shW-3,26,cx+waW,42);
      g.lineTo(cx+hpW,52);
      g.lineTo(cx-hpW,52);
      g.lineTo(cx-waW,42);
      g.quadraticCurveTo(cx-shW+3,26,cx-shW,9);
      g.closePath();
    };
    g.fillStyle=vGrad(g,cx-shW,6,cx+shW,52,[[0,p.hi],[0.5,p.mid],[1,p.lo]]);
    body(); g.fill();
    // 凸出的锁骨
    g.strokeStyle=p.hi; g.lineWidth=1.5; g.globalAlpha=0.85;
    g.beginPath(); g.moveTo(cx-shW+6,13); g.quadraticCurveTo(cx-5,16,cx-1,13.5); g.stroke();
    g.beginPath(); g.moveTo(cx+shW-6,12); g.quadraticCurveTo(cx+5,15,cx+1,13.5); g.stroke();
    g.strokeStyle=p.lo; g.lineWidth=1;
    g.beginPath(); g.moveTo(cx-shW+6,14.5); g.quadraticCurveTo(cx-5,17.5,cx-1,15); g.stroke();
    g.globalAlpha=1;
    // 肋骨（凹陷的皮包骨）
    g.globalAlpha=0.6;
    for (let i=0;i<5;i++){
      const ry=20+i*4.4, spread=(shW-4)*(1-i*0.07);
      g.strokeStyle=p.lo; g.lineWidth=1.7;
      g.beginPath(); g.moveTo(cx-1.5,ry); g.quadraticCurveTo(cx-spread*0.7,ry+1.5,cx-spread,ry+4.5); g.stroke();
      g.beginPath(); g.moveTo(cx+1.5,ry); g.quadraticCurveTo(cx+spread*0.7,ry+1.5,cx+spread,ry+4.5); g.stroke();
      g.strokeStyle=p.hi; g.lineWidth=0.8;
      g.beginPath(); g.moveTo(cx-1.5,ry-1.3); g.quadraticCurveTo(cx-spread*0.7,ry+0.2,cx-spread,ry+3.2); g.stroke();
      g.beginPath(); g.moveTo(cx+1.5,ry-1.3); g.quadraticCurveTo(cx+spread*0.7,ry+0.2,cx+spread,ry+3.2); g.stroke();
    }
    g.strokeStyle=p.lo; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(cx,18); g.lineTo(cx,46); g.stroke();
    g.globalAlpha=1;
    mottle(g,cx-shW,8,shW*2,42,30,[p.lo,p.decay],1,3.5,0.07,0.18);
    // 腹侧咬痕大创口
    gash(g, cx-shW*0.55, 31, 6.5, 3.4, -0.6);
    bloodTrail(g, cx-shW*0.55, 34, 9, 2);
    gash(g, cx+shW*0.5, 16, 3.5, 2, 0.4);
    if (o.shirt){
      g.fillStyle=vGrad(g,cx,8,cx,48,[[0,o.shirt.hi],[1,o.shirt.lo]]);
      g.beginPath();
      g.moveTo(cx-shW,9); g.quadraticCurveTo(cx,5,cx+shW,8);
      g.lineTo(cx+shW-4,24);
      let tx=cx+shW-4;
      for (let i=0;i<6;i++){ tx-=(shW*2-8)/6; g.lineTo(tx+3, 24+((i%2)?9:2)+rand(0,4)); }
      g.lineTo(cx-shW+4,26); g.closePath(); g.fill();
      g.strokeStyle='rgba(0,0,0,0.4)'; g.lineWidth=0.8;
      for (let i=0;i<4;i++){
        g.beginPath(); g.moveTo(cx-shW+8+i*10,10); g.lineTo(cx-shW+5+i*10,22+rand(0,5)); g.stroke();
      }
      mottle(g,cx-shW,8,shW*2,18,12,['#2a0606','#14141c'],1.5,4,0.2,0.4);
    }
    // 裤腰 + 皮带
    const pants = o.pants||JEANS;
    g.fillStyle=vGrad(g,cx,44,cx,58,[[0,pants.hi],[1,pants.lo]]);
    g.beginPath();
    g.moveTo(cx-waW-1,43); g.lineTo(cx+waW+1,43); g.lineTo(cx+hpW+1,58); g.lineTo(cx-hpW-1,58);
    g.closePath(); g.fill();
    g.fillStyle='#1c1409';
    g.fillRect(cx-waW-1,43,waW*2+2,4.6);
    g.fillStyle='#8e7a4e'; g.fillRect(cx-2.6,43.4,5.2,3.8);
    g.fillStyle='#5c4c26'; g.fillRect(cx-1.2,44.4,2.4,1.8);
    g.fillStyle='#1c1409';
    for (const lx of [-waW+3, -6, 6, waW-6]) g.fillRect(cx+lx,42.4,2.6,5.6);
    g.globalAlpha=0.5; g.strokeStyle='#0e0c09'; g.lineWidth=1.3;
    body(); g.stroke(); g.globalAlpha=1;
  });
}

function buildUarm(p,o){
  o = o||{};
  const uw = o.big?19:14, uh = 32;
  return newPart(uw,uh,(g,w)=>{
    const cx=w/2;
    g.fillStyle=vGrad(g,0,0,w,0,[[0,p.hi],[0.5,p.mid],[1,p.lo]]);
    g.beginPath();
    g.arc(cx,5,w*0.42,Math.PI,0);
    g.lineTo(cx+w*0.3,29); g.lineTo(cx-w*0.3,29);
    g.closePath(); g.fill();
    if (o.sleeve){
      g.fillStyle=o.sleeve;
      g.beginPath(); g.arc(cx,5,w*0.45,Math.PI,0);
      g.lineTo(cx+w*0.36,12); g.lineTo(cx-w*0.36,13); g.closePath(); g.fill();
    }
    g.globalAlpha=0.45; g.strokeStyle=p.lo; g.lineWidth=1;
    g.beginPath(); g.moveTo(cx+w*0.26,8); g.lineTo(cx+w*0.2,26); g.stroke();
    g.globalAlpha=1;
    mottle(g,2,4,w-4,24,10,[p.lo,p.decay],0.8,2,0.08,0.2);
  }, {edge:3});
}
function buildFarm(p,o){
  o = o||{};
  const uw = o.big?20:15, uh = 38;
  return newPart(uw,uh,(g,w)=>{
    const cx=w/2;
    g.fillStyle=vGrad(g,0,0,w,0,[[0,p.hi],[0.5,p.mid],[1,p.lo]]);
    g.beginPath();
    g.moveTo(cx-w*0.34,0); g.lineTo(cx+w*0.34,0);
    g.lineTo(cx+w*0.24,26); g.lineTo(cx-w*0.24,26);
    g.closePath(); g.fill();
    g.globalAlpha=0.55; g.strokeStyle=p.lo; g.lineWidth=0.8;
    g.beginPath(); g.moveTo(cx-1,3); g.lineTo(cx-2,22); g.stroke();
    g.beginPath(); g.moveTo(cx+2.5,4); g.lineTo(cx+2,20); g.stroke();
    g.globalAlpha=1;
    // 爪手：骨节分明
    g.fillStyle=p.mid;
    g.beginPath(); g.ellipse(cx,29,w*0.34,4.2,0,0,TAU); g.fill();
    g.strokeStyle=p.mid; g.lineWidth=1.9;
    for (let i=0;i<4;i++){
      const fx=cx-w*0.3+i*(w*0.2), fy=31;
      g.beginPath(); g.moveTo(fx,fy);
      g.lineTo(fx+rand(-1.4,0.6),fy+3.2);
      g.lineTo(fx+rand(-2,1),fy+6);
      g.stroke();
    }
    g.strokeStyle=p.lo; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(cx-w*0.36,28); g.lineTo(cx-w*0.46,33); g.stroke();
    g.fillStyle='#211a12';
    for (let i=0;i<4;i++) g.fillRect(cx-w*0.32+i*(w*0.2),35.6,1.3,1.8);
    mottle(g,2,2,w-4,26,8,[p.lo,p.decay],0.7,1.8,0.08,0.2);
  }, {edge:3});
}
function buildThigh(p,o){
  o = o||{};
  const uw = o.big?20:15, uh = 34;
  const pants = o.pants||JEANS;
  return newPart(uw,uh,(g,w)=>{
    const cx=w/2;
    g.fillStyle=vGrad(g,0,0,w,0,[[0,pants.hi],[0.45,pants.mid],[1,pants.lo]]);
    g.beginPath();
    g.moveTo(cx-w*0.44,0); g.lineTo(cx+w*0.44,0);
    g.lineTo(cx+w*0.3,32); g.lineTo(cx-w*0.3,32);
    g.closePath(); g.fill();
    g.strokeStyle='rgba(0,0,0,0.35)'; g.lineWidth=0.8;
    for (let i=0;i<3;i++){
      g.beginPath(); g.moveTo(cx-3+i*3,4+i*2); g.lineTo(cx-4+i*3,18+i*4); g.stroke();
    }
    mottle(g,1,2,w-2,30,7,['#0c0a10','#2a0808'],1,3,0.12,0.3);
  }, {edge:2});
}
function buildShin(p,o){
  o = o||{};
  const uw = o.big?18:14, uh = 38;
  const pants = o.pants||JEANS;
  return newPart(uw,uh,(g,w)=>{
    const cx=w/2;
    g.fillStyle=vGrad(g,0,0,w,0,[[0,pants.hi],[0.45,pants.mid],[1,pants.lo]]);
    g.beginPath();
    g.moveTo(cx-w*0.36,0); g.lineTo(cx+w*0.36,0);
    g.lineTo(cx+w*0.3,24); g.lineTo(cx+w*0.14,27); g.lineTo(cx+w*0.2,22);
    g.lineTo(cx-w*0.1,26); g.lineTo(cx-w*0.3,23);
    g.closePath(); g.fill();
    g.strokeStyle='rgba(0,0,0,0.35)'; g.lineWidth=0.8;
    g.beginPath(); g.moveTo(cx+1,3); g.lineTo(cx+2,20); g.stroke();
    if (o.shoe){
      g.fillStyle='#191512';
      g.beginPath(); g.ellipse(cx+1,33,w*0.42,4.6,0,0,TAU); g.fill();
      g.fillStyle='#0c0a08'; g.fillRect(cx-w*0.4,34.5,w*0.84,3);
    } else {
      g.fillStyle=p.mid;
      g.beginPath(); g.moveTo(cx-w*0.26,25); g.lineTo(cx+w*0.26,25);
      g.lineTo(cx+w*0.4,35); g.lineTo(cx-w*0.34,35); g.closePath(); g.fill();
      g.fillStyle=p.lo;
      for (let i=0;i<3;i++) g.fillRect(cx-w*0.28+i*(w*0.22),34,1.6,2);
      mottle(g,2,24,w-4,10,5,[p.lo,'#2a0808'],0.8,2,0.15,0.3);
    }
  }, {edge:2});
}

// 各类型部件集合（每类两款头，随机+镜像=更多变化）
const PARTS = {};
function buildAllParts(){
  const sh = SKINS.shambler;
  PARTS.shambler = { heads:[buildHead(sh,{v:0}),buildHead(sh,{v:1})], torso:buildTorso(sh),
    uarm:buildUarm(sh), farm:buildFarm(sh), thigh:buildThigh(sh), shin:buildShin(sh) };
  const ru = SKINS.runner, shirt={hi:'#7e909e',lo:'#48555f'};
  PARTS.runner = { heads:[buildHead(ru,{feral:1}),buildHead(ru,{feral:1,v:1})], torso:buildTorso(ru,{shirt}),
    uarm:buildUarm(ru,{sleeve:'#66788a'}), farm:buildFarm(ru), thigh:buildThigh(ru), shin:buildShin(ru) };
  const br = SKINS.brute, bp={hi:'#34343a',mid:'#26262c',lo:'#18181e'};
  PARTS.brute = { heads:[buildHead(br,{stitched:1}),buildHead(br,{stitched:1,v:1})], torso:buildTorso(br,{big:1,pants:bp}),
    uarm:buildUarm(br,{big:1}), farm:buildFarm(br,{big:1}), thigh:buildThigh(br,{big:1,pants:bp}), shin:buildShin(br,{big:1,pants:bp}) };
  const th = SKINS.thrower, tpn={hi:'#3c3448',mid:'#2c2638',lo:'#1e1a28'};
  PARTS.thrower = { heads:[buildHead(th,{hood:1}),buildHead(th,{hood:1,v:1})], torso:buildTorso(th,{shirt:{hi:'#453b58',lo:'#262032'},pants:tpn}),
    uarm:buildUarm(th,{sleeve:'#382f48'}), farm:buildFarm(th), thigh:buildThigh(th,{pants:tpn}), shin:buildShin(th,{pants:tpn}) };
  const cv = SKINS.civ, cpn={hi:'#484e5a',mid:'#363b46',lo:'#242830'};
  PARTS.civ = { heads:[buildHead(cv,{civ:1}),buildHead(cv,{civ:1})], torso:buildTorso(cv,{shirt:{hi:'#ddd8cc',lo:'#a8a294'},pants:cpn}),
    uarm:buildUarm(cv,{sleeve:'#ccc6b8'}), farm:buildFarm(cv), thigh:buildThigh(cv,{pants:cpn}), shin:buildShin(cv,{pants:cpn,shoe:1}) };
}
buildAllParts();

// ---------- Boss 部件 ----------
const BOSSP = {};
function buildBossParts(){
  const p = { hi:'#8b9180', mid:'#5c6356', lo:'#2f342c', decay:'#4a5440' };
  BOSSP.torso = newPart(150,184,(g)=>{
    const cx=75;
    const body=()=>{
      g.beginPath();
      g.moveTo(cx-58,24);
      g.quadraticCurveTo(cx,2,cx+58,24);
      g.quadraticCurveTo(cx+46,86,cx+34,150);
      g.lineTo(cx+36,160); g.lineTo(cx-36,160); g.lineTo(cx-34,150);
      g.quadraticCurveTo(cx-46,86,cx-58,24);
      g.closePath();
    };
    g.fillStyle=vGrad(g,cx-58,10,cx+58,160,[[0,p.hi],[0.5,p.mid],[1,p.lo]]);
    body(); g.fill();
    // 侧面体积阴影
    g.globalAlpha=0.4; g.fillStyle=p.lo;
    g.beginPath(); g.moveTo(cx+44,30); g.quadraticCurveTo(cx+40,90,cx+30,152); g.lineTo(cx+36,158);
    g.quadraticCurveTo(cx+48,86,cx+56,28); g.closePath(); g.fill();

function deadTree(g,x,y,len,ang,depth,lw){
  if (depth<=0 || len<3) return;
  const x2=x+Math.sin(ang)*len, y2=y-Math.cos(ang)*len;
  g.strokeStyle='#060709'; g.lineWidth=lw;
  g.beginPath(); g.moveTo(x,y); g.lineTo(x2,y2); g.stroke();
  const n = depth>2?2:(Math.random()<0.7?2:1);
  for (let i=0;i<n;i++){
    deadTree(g,x2,y2,len*rand(0.62,0.8),ang+rand(-0.65,0.65),depth-1,Math.max(0.6,lw*0.6));
  }
}
// 蛛网（角落恐怖标配）
function cobweb(g,x,y,r,a0,a1,alpha){
  g.strokeStyle=`rgba(190,195,205,${alpha})`; g.lineWidth=0.7;
  const spokes=6;
  for (let i=0;i<=spokes;i++){
    const a=lerp(a0,a1,i/spokes);
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); g.stroke();
  }
  for (let ring=1;ring<=4;ring++){
    const rr=r*ring/4*rand(0.9,1);
    g.beginPath();
    for (let i=0;i<=spokes;i++){
      const a=lerp(a0,a1,i/spokes);
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr+ring*1.5;
      if (i===0) g.moveTo(px,py);
      else g.quadraticCurveTo(x+Math.cos(lerp(a0,a1,(i-0.5)/spokes))*rr*0.92, y+Math.sin(lerp(a0,a1,(i-0.5)/spokes))*rr*0.92+ring*2, px,py);
    }
    g.stroke();
  }
}
// 地面拖行血痕
function dragMark(g,x0,y0,x1,y1,w){
  g.save();
  g.strokeStyle='rgba(38,6,5,0.75)'; g.lineWidth=w; g.lineCap='round';
  g.beginPath(); g.moveTo(x0,y0);
  g.quadraticCurveTo((x0+x1)/2+rand(-20,20),(y0+y1)/2,x1,y1);
  g.stroke();
  g.strokeStyle='rgba(38,6,5,0.4)'; g.lineWidth=w*1.8;
  g.beginPath(); g.moveTo(x0,y0);
  g.quadraticCurveTo((x0+x1)/2+rand(-20,20),(y0+y1)/2,x1,y1);
  g.stroke();
  g.strokeStyle='rgba(38,6,5,0.6)'; g.lineWidth=1.5;
  for (let i=0;i<4;i++){
    g.beginPath(); g.moveTo(x1-6+i*4,y1-3); g.lineTo(x1-2+i*4,y1+6); g.stroke();
  }
  g.restore();
}

function bookshelf(g,x,y,w,h,shelves){

    while (bx < x+w-5){

      const bw=rand(3.5,8), bh=sh-6-rand(0,7);

    G.parts.push({ x, y, vx:rand(-1,1)*(pw||120), vy:rand(-1.4,0.4)*(pw||120),
      g:420, r:rand(1.5,chunk?5.5:4), life:rand(0.35,0.8), t:0,
      color: chunk?'#3a0808':(color||pick(['#701212','#560c0c','#8a1810'])) });
  }
}
function sparks(x,y,n){
  for (let i=0;i<n;i++){
    G.parts.push({ x, y, vx:rand(-180,180), vy:rand(-220,40),
      g:520, r:rand(1,2.4), life:rand(0.15,0.4), t:0, color:'#e0c98e' });
  }
}

// ---------- 血渍/尸体持久层 ----------
let goreC=null, goreG=null, corpseN=0;
function resetGore(){ goreC=newCanvas(W,H); goreG=goreC.getContext('2d'); corpseN=0; }
function stampCorpse(z){
  if (!goreG || corpseN>26) return;
  corpseN++;
  const pz=persp(z.civ?0.5:z.z), k=pz.k*z.tp.size;
  const sx=z.civ?z.sx:lerp(z.x0,z.xT,z.z), sy=pz.y;
  const g=goreG;
  const pool=g.createRadialGradient(sx,sy,2,sx,sy,44*k);
  pool.addColorStop(0,'rgba(24,3,3,0.9)'); pool.addColorStop(1,'rgba(24,3,3,0)');
  g.fillStyle=pool;
  g.beginPath(); g.ellipse(sx,sy+2*k,46*k,12*k,0,0,TAU); g.fill();
  g.save(); g.translate(sx,sy); g.scale(k,k);
  g.rotate(z.headshot?1.42:-1.5);
  try{ g.filter='brightness(0.35) saturate(0.7)'; }catch(e){}
  const P=PARTS[z.type];
  g.drawImage(P.thigh,-16,-56,P.thigh.uw,P.thigh.uh);
  g.drawImage(P.torso,-P.torso.uw/2,-104,P.torso.uw,P.torso.uh);
  if (!z.headshot) g.drawImage(z.headC||P.heads[0],-22,-148,44,58);
  try{ g.filter='none'; }catch(e){}
  g.restore();
}
function stampSplatter(x,y,big){
  if (!goreG) return;
  const g=goreG;
  g.fillStyle='rgba(36,6,5,0.55)';
  const n=big?7:4;
  for (let i=0;i<n;i++){
    g.beginPath();
    g.ellipse(x+rand(-14,14),y+rand(-10,12),rand(1.5,big?6:4),rand(1,3),rand(0,TAU),0,TAU);
    g.fill();
  }
}
function stampHole(x,y){
  if (!goreG) return;
  const g=goreG;
  g.fillStyle='#07070a';
  g.beginPath(); g.arc(x,y,3.6,0,TAU); g.fill();
  g.strokeStyle='rgba(150,150,160,0.25)'; g.lineWidth=1.4;
  g.beginPath(); g.arc(x,y,5,0,TAU); g.stroke();
}

// ---------- 生成 ----------
function spawnZombie(type, x0){
  const tp = TYPES[type];
  if (type === 'civ'){
    const dir = x0 < W/2 ? 1 : -1;
    G.zombies.push({ type, tp, civ:true, dir, sx:x0, z:0.5, hp:1,
      state:'walk', t:0, phase:rand(0,TAU), flash:0, geo:null, flip:false,
      headC:PARTS.civ.heads[0], hunch:0, headTilt:0, gaitWarp:1, gaitSeed:0, twitch:0, twitchT:99 });
    sfx.civ(); say('平民！不要开枪！','DON\'T SHOOT!',1.5,'#9ad9ff');
    return;
  }
  if (!G.waveStung || type==='brute'){ sfx.sting(); G.waveStung = true; }
  G.zombies.push({ type, tp, x0, xT: x0 + (W/2 - x0)*0.35,
    z: rand(0.03,0.08), hp:tp.hp, spd: tp.spd*rand(0.9,1.12),
    state:'walk', t:0, phase:rand(0,TAU), flash:0, geo:null, headshot:false,
    flip: Math.random()<0.5,
    headC: pick(PARTS[type].heads),
    hunch: rand(0.08,0.22), headTilt: rand(-0.22,0.22),
    gaitWarp: rand(0.7,1.3), gaitSeed: rand(0,TAU),
    twitch:0, twitchT: rand(0.8,3) });
}
function throwHatchet(z){
  const g = z.geo; if (!g) return;
  G.hatchets.push({ x0:g.hx, y0:g.hy+20, x1:rand(W*0.3,W*0.7), y1:H*0.8,
    q:0, dur:1.7, rot:rand(0,TAU), k0:g.k, geo:null });
  sfx.swing();
}

// ---------- 关卡推进 ----------
function startScene(i){
  G.sceneIdx = i; G.waveIdx = 0; G.sceneClean = true;
  G.zombies.length = 0; G.hatchets.length = 0;
  resetGore();
  setState('scene_intro');
}
function startWave(){
  const wave = SCENES[G.sceneIdx].waves[G.waveIdx];
  G.pending = wave.map(s=>({...s})); G.waveT = 0; G.lull = 0; G.waveStung = false;
  setState('play');
}
function sceneCleared(){
  if (G.sceneClean){ G.score += 500; addPop(W/2, H/2-40, 'PERFECT +500', '#7dffa8', true); }
  if (G.sceneIdx + 1 < SCENES.length){ setState('walk'); }
  else { setState('bossintro'); sfx.roar(); }
}
function initBoss(){
  G.boss = { hp:BOSS_CFG.hp, max:BOSS_CFG.hp, z:0.2, state:'enter', t:0,
    windupDmg:0, vulnerable:false, sway:0, geo:null, dead:false };
  G.zombies.length = 0; G.hatchets.length = 0;
  resetGore();
  setState('boss');
}
function resetRun(){
  Object.assign(G, { sceneIdx:0, waveIdx:0, ammo:G.mag, reloading:false,
    lives:5, score:0, shots:0, hits:0, kills:0, continues:0,
    civSaved:0, civKilled:0, hurtT:0, shake:0, boss:null, msg:null });
  G.zombies.length=0; G.hatchets.length=0; G.parts.length=0;
  G.pops.length=0; G.effects.length=0;
}

// ---------- 玩家 ----------
function hurt(d){
  if (G.state!=='play' && G.state!=='boss') return;
  G.lives -= d; G.hurtT = 1; G.sceneClean = false;
  addShake(11); sfx.hurt();
  G.effects.push({ type:'claw', t:0 });
  if (G.lives <= 0){ G.lives = 0; G.continueT = 9.99; setState('continue'); }
}
function heal(n){ G.lives = Math.min(G.maxLives, G.lives+n); }

function startReload(){
  if (G.reloading || G.ammo === G.mag) return;
  G.reloading = true; G.reloadT = 0; sfx.reload();
}

function shoot(mx,my){
  if (G.reloading) return;
  if (G.ammo <= 0){ sfx.dry(); say('装弹！','RELOAD — 按 R / 右键',0.8,'#ff6a5e'); return; }
  G.ammo--; G.shots++; G.muzzle = 0.07; addShake(2.4); sfx.shot();

  if (tryHit(mx,my)){ G.hits++; }
  else { stampHole(mx,my); }
  if (G.ammo===0) say('装弹！','RELOAD',0.9,'#ff6a5e');
}

function tryHit(mx,my){
  // 1) 飞斧（最靠近视点）
  for (const h of G.hatchets){
    if (!h.geo || h.dead) continue;
    const dx=mx-h.geo.x, dy=my-h.geo.y;
    if (dx*dx+dy*dy < h.geo.r*h.geo.r){
      h.dead = true; G.score += 150; addPop(h.geo.x,h.geo.y,'+150','#9ad9ff');
      sparks(h.geo.x,h.geo.y,14); sfx.ricochet(); return true;
    }
  }
  // 2) Boss
  const b = G.boss;
  if (b && !b.dead && b.geo){
    const g = b.geo;
    const dx=mx-g.heartX, dy=my-g.heartY;
    if (b.vulnerable && dx*dx+dy*dy < g.heartR*g.heartR){
      b.hp -= BOSS_CFG.weakDmg; b.flash = 0.12;
      if (b.state==='windup'){
        b.windupDmg += BOSS_CFG.weakDmg;
        if (b.windupDmg >= BOSS_CFG.staggerNeed){ b.state='stagger'; b.t=0; sfx.roar(); say('破绽！','STAGGERED',1.1,'#7dffa8'); }
      }
      G.score += 50; blood(mx,my,10,'#8a1810',160); addPop(mx,my,'+50','#ff8d7a'); sfx.head();
      stampSplatter(mx,my,true);
      if (b.hp <= 0){ b.dead = true; setState('bossdie'); sfx.boom(); }
      return true;
    }
    if (mx>g.bx && mx<g.bx+g.bw && my>g.by && my<g.by+g.bh){
      sparks(mx,my,8); sfx.ricochet(); addPop(mx,my,'装甲','#b8b8b8'); return true;
    }
  }
  // 3) 丧尸（近→远）
  const zs = [...G.zombies].sort((a,b)=>b.z-a.z);
  for (const z of zs){
    if (z.state==='dying' || !z.geo) continue;
    const g = z.geo;
    if (z.civ){
      if (mx>g.bx && mx<g.bx+g.bw && my>g.by-g.hr*2 && my<g.by+g.bh){
        z.hp = 0; z.state='dying'; z.t=0; G.civKilled++;
        G.score = Math.max(0, G.score-500);
        blood(mx,my,16); sfx.scream();
        say('你击中了平民！','-500',1.6,'#ff5a4e');
        return true;
      }
      continue;
    }
    const hx=mx-g.hx, hy=my-g.hy;
    if (hx*hx+hy*hy < g.hr*g.hr){ damageZombie(z, 3, true, mx, my); return true; }
    if (mx>g.bx && mx<g.bx+g.bw && my>g.by && my<g.by+g.bh){ damageZombie(z, 1, false, mx, my); return true; }
  }
  return false;
}

function damageZombie(z, d, head, mx, my){
  z.hp -= d; z.flash = 0.12; z.z = Math.max(0.03, z.z - 0.018);
  z.twitch = 0.25;
  blood(mx,my, head?18:10, undefined, head?170:120);
  stampSplatter(mx,my, head);
  if (z.hp <= 0){
    z.state='dying'; z.t=0; z.headshot = head;
    G.kills++;
    const sc = z.tp.score + (head?100:0);
    G.score += sc;
    addPop(mx,my-14, head?('爆头 +'+sc):('+'+sc), head?'#e8d488':'#e0c98e', head);
    if (head){ sfx.head(); blood(z.geo.hx, z.geo.hy, 26, '#701212', 220); }
    else sfx.hit();
    sfx.groan(rand(70,110));
  } else {
    sfx.hit();
  }
}

// ---------- 更新 ----------
function update(dt){
  G.tGlobal += dt; G.t += dt;
  G.hurtT = Math.max(0, G.hurtT - dt*1.6);
  G.shake = Math.max(0, G.shake - dt*26);
  G.muzzle = Math.max(0, G.muzzle - dt);
  // 手持摄影机漂移
  G.camX = Math.sin(G.tGlobal*0.31)*2.2 + Math.sin(G.tGlobal*0.83)*1.1;
  G.camY = Math.sin(G.tGlobal*0.23)*1.8 + Math.sin(G.tGlobal*0.71)*0.9;
  if (G.msg){ G.msg.t += dt; if (G.msg.t > G.msg.dur) G.msg = null; }
  if (G.reloading){
    G.reloadT += dt;
    if (G.reloadT >= 0.75){ G.reloading = false; G.ammo = G.mag; }
  }
  // 闪电（第一幕/标题）
  const gateVisible = G.state==='title' || ((G.state==='play'||G.state==='walk'||G.state==='scene_intro') && SCENES[G.sceneIdx].bg===0);
  if (gateVisible){
    G.ltT -= dt;
    if (G.ltT<=0){ G.ltFlash=1; G.ltT=rand(7,15); sfx.thunder(); }
  }
  G.ltFlash = Math.max(0, G.ltFlash - dt*2.6);
  // 灯光失灵（室内）
  const interior = (G.state==='play'&&SCENES[G.sceneIdx].bg!==0) || G.state==='boss';
  if (interior){
    G.flkT -= dt;
    if (G.flkT<=0){ G.flk=0.55; G.flkT=rand(6,13); sfx.buzz(); }
  }
  G.flk = Math.max(0, G.flk - dt);
  // 粒子 / 浮字 / 特效
  for (const p of G.parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; }
  G.parts = G.parts.filter(p=>p.t<p.life);
  for (const p of G.pops) p.t+=dt;
  G.pops = G.pops.filter(p=>p.t<0.95);
  for (const e of G.effects) e.t+=dt;
  G.effects = G.effects.filter(e=>e.t<0.4);

  switch (G.state){
    case 'title': break;
    case 'story':
      G.storyChars += dt*22;
      break;
    case 'scene_intro':
      if (G.t > 1.6) startWave();
      break;
    case 'walk':
      G.stepCd -= dt;
      if (G.stepCd<=0){ sfx.step(); G.stepCd = 0.42; }
      if (G.t > 2.2) startScene(G.sceneIdx+1);
      break;
    case 'play': updatePlay(dt); break;
    case 'bossintro':
      if (G.t > 3.0) initBoss();
      break;
    case 'boss':
      updateBoss(dt);
      updateHatchets(dt);
      break;
    case 'bossdie':
      addShake(3);
      if (Math.random()<0.3){
        const g = G.boss.geo;
        if (g){
          blood(g.heartX+rand(-70,70), g.heartY+rand(-100,80), 8, '#8a1810', 240);
          stampSplatter(g.heartX+rand(-90,90), g.heartY+rand(-60,140), true);
        }
      }
      if (G.t > 2.2){
        G.score += 5000;
        setState('victory'); sfx.coin();
      }
      break;
    case 'continue':
      G.continueT -= dt;
      if (G.continueT <= 0) setState('gameover');
      break;
  }

  // 低血量：心跳 + 喘息
  if ((G.state==='play'||G.state==='boss') && G.lives===1){
    G.heartCd -= dt;
    if (G.heartCd<=0){ sfx.heart(); sfx.breath(); G.heartCd = 1.1; }
  }
}

function updatePlay(dt){
  G.waveT += dt;
  for (let i=G.pending.length-1;i>=0;i--){
    if (G.waveT >= G.pending[i].t){
      spawnZombie(G.pending[i].type, G.pending[i].x);
      G.pending.splice(i,1);
    }
  }
  updateZombies(dt);
  updateHatchets(dt);

  G.groanCd -= dt;
  if (G.groanCd<=0 && G.zombies.some(z=>!z.civ && z.state!=='dying')){
    sfx.groan(rand(60,95)); G.groanCd = rand(1.6,3.2);
  }

  if (!G.pending.length && !G.zombies.length && !G.hatchets.length){
    G.lull += dt;
    if (G.lull > 0.9){
      G.waveIdx++;
      if (G.waveIdx < SCENES[G.sceneIdx].waves.length) startWave();
      else sceneCleared();
    }
  }
}

function updateZombies(dt){
  for (const z of G.zombies){
    z.phase += dt * (z.type==='runner'?8:3.6) * (z.gaitWarp||1);
    z.flash = Math.max(0, z.flash - dt);
    z.twitch = Math.max(0, z.twitch - dt*0.9);
    if (z.state==='dying'){
      z.t += dt;
      continue;
    }
    z.twitchT -= dt;
    if (z.twitchT<=0){ z.twitch=Math.max(z.twitch,0.18); z.twitchT=rand(1.2,4.2); }
    if (z.civ){
      z.sx += z.dir * 128 * dt;
      if ((z.dir>0 && z.sx > W+50) || (z.dir<0 && z.sx < -50)){
        z.state='gone'; G.civSaved++; heal(1);
        say('平民成功逃脱','生命 +1',1.6,'#7dffa8'); sfx.civ();
      }
      continue;
    }
    switch (z.state){
      case 'walk': {
        const hold = z.tp.holdZ;
        if (hold && z.z >= hold){ z.state='hold'; z.t = rand(0.4,0.9); break; }
        // 蹒跚：停顿—猛冲的节奏
        const surge = 0.22 + 1.55*Math.pow(0.5+0.5*Math.sin(z.phase*0.5+z.gaitSeed), 2.4);
        z.z += z.spd * dt * surge;
        if (z.z >= 1){ z.z = 1; z.state='windup'; z.t = 0; }
        break;
      }
      case 'hold':
        z.t -= dt;
        if (z.t <= 0){ throwHatchet(z); z.t = rand(2.4,3.4); }
        break;
      case 'windup':
        z.t += dt;
        if (z.t > (z.type==='runner'?0.45:0.7)){
          hurt(z.tp.dmg); z.state='recoil'; z.t=0; sfx.swing();
        }
        break;
      case 'recoil':
        z.t += dt;
        if (z.t > 0.5){ z.z = 0.8; z.state='walk'; }
        break;
    }
  }
  G.zombies = G.zombies.filter(z=>{
    if (z.state==='gone') return false;
    if (z.state==='dying' && z.t>0.85){ stampCorpse(z); return false; }
    return true;
  });
}

function updateHatchets(dt){
  for (const h of G.hatchets){
    if (h.dead){ h.q = 2; continue; }
    h.q += dt / h.dur; h.rot += dt*13;
    if (h.q >= 1){ h.q = 2; hurt(1); }
  }
  G.hatchets = G.hatchets.filter(h=>h.q<1.5);
}

function updateBoss(dt){
  const b = G.boss;
  b.t += dt; b.flash = Math.max(0,(b.flash||0)-dt);
  b.sway = Math.sin(G.tGlobal*1.7)*8;
  const enraged = b.hp < b.max*0.5;
  switch (b.state){
    case 'enter':
      b.z = lerp(0.2, 0.62, Math.min(1, b.t/1.6));
      b.vulnerable = false;
      if (b.t > 1.8){ b.state='expose'; b.t=0; sfx.roar(); say('弱点：心脏','AIM FOR THE HEART',1.6,'#ff8d7a'); }
      break;
    case 'expose':
      b.vulnerable = true;
      if (b.t > (enraged?1.5:2.3)){ b.state='windup'; b.t=0; b.windupDmg=0; }
      break;
    case 'windup':
      b.vulnerable = true;
      if (b.t > (enraged?0.7:1.0)){ b.state='attack'; b.t=0; sfx.swing(); }
      break;
    case 'attack':
      b.vulnerable = false;
      if (b.t > 0.18 && !b.struck){ b.struck = true; hurt(1); }
      if (b.t > 0.55){ b.state='expose'; b.t=0; b.struck=false; }
      break;
    case 'stagger':
      b.vulnerable = true;
      if (b.t > 1.6){ b.state='expose'; b.t=0; }
      break;
  }
}

// ---------- 动态背景层 ----------
function drawFog(t, alpha){
  ctx.save(); ctx.globalAlpha = alpha;
  for (let i=0;i<5;i++){
    const x = ((t*14 + i*260) % (W+420)) - 210;
    const y = 330 + i*38;
    const g = ctx.createRadialGradient(x,y,10,x,y,150);
    g.addColorStop(0,'rgba(130,140,160,0.5)'); g.addColorStop(1,'rgba(130,140,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x,y,180,44,0,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function flame(x,y,s,t,seed){
  const f = 0.7 + 0.3*Math.sin(t*9+seed*7);
  const g = ctx.createRadialGradient(x,y,1,x,y,20*s*f);
  g.addColorStop(0,'rgba(255,175,80,0.38)'); g.addColorStop(1,'rgba(255,135,45,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,20*s*f,0,TAU); ctx.fill();
  ctx.fillStyle='#f2b968';
  ctx.beginPath(); ctx.ellipse(x,y,3.2*s,(5.6+2*f)*s,0,0,TAU); ctx.fill();
  ctx.fillStyle='#ffe9c0';
  ctx.beginPath(); ctx.ellipse(x,y+2*s,1.5*s,2.8*s,0,0,TAU); ctx.fill();
}

function bgGate(t){
  ctx.drawImage(BGC[0],0,0);
  ctx.fillStyle='rgba(5,8,16,0.5)';
  for (let i=0;i<3;i++){
    const x=((t*9+i*370)%(W+480))-240;
    ctx.beginPath(); ctx.ellipse(x,80+i*46,190,26,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+70,88+i*46,120,18,0,0,TAU); ctx.fill();
  }
  for (let i=0;i<GATE_WINS.length;i++){
    ctx.globalAlpha = 0.35 + 0.28*Math.sin(t*6+i*2.4);
    ctx.fillStyle='#b57d32'; ctx.fillRect(GATE_WINS[i][0],GATE_WINS[i][1],14,20);
  }
  ctx.globalAlpha=1;
  flame(82, 178, 1.15, t, 1);
  flame(W-82, 178, 1.15, t, 2);
  drawFog(t, 0.13);
}
function bgLibrary(t){
  ctx.drawImage(BGC[1],0,0);
  for (let i=0;i<LIB_FLAMES.length;i++) flame(LIB_FLAMES[i][0],LIB_FLAMES[i][1],0.66,t,i);
  ctx.globalAlpha = 0.5+0.2*Math.sin(t*3);
  const lg=ctx.createRadialGradient(208,370,4,208,370,52);
  lg.addColorStop(0,'rgba(105,195,130,0.28)'); lg.addColorStop(1,'rgba(105,195,130,0)');
  ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(208,370,52,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='#c3ccdc';
  for (const m of motes){
    ctx.globalAlpha=m.a*(0.6+0.4*Math.sin(t*2+m.x));
    ctx.fillRect(m.x,m.y,1.4,1.4);
  }
  ctx.globalAlpha=1;
  drawFog(t,0.07);
}
function bgBallroom(t){
  ctx.drawImage(BGC[2],0,0);

const BASE_DARK = [0.52, 0.62, 0.58];
function sceneLights(bg){
  const L = [];
  if (bg===0){
    L.push({x:710,y:105,r:330,a:0.85});
    L.push({x:82,y:180,r:140,a:0.8},{x:W-82,y:180,r:140,a:0.8});
    L.push({x:480,y:505,r:400,a:0.5});
  } else if (bg===1){
    L.push({x:480,y:250,r:290,a:0.9});
    L.push({x:208,y:372,r:170,a:0.85});
    for (const f of LIB_FLAMES) L.push({x:f[0],y:f[1],r:120,a:0.6});
    L.push({x:480,y:505,r:360,a:0.45});
  } else {
    L.push({x:462,y:214,r:330,a:0.9});
    for (const f of BALL_FLAMES) L.push({x:f[0],y:f[1],r:105,a:0.55});
    L.push({x:480,y:505,r:380,a:0.48});
  }
  if (G.muzzle>0) L.push({x:aim.x,y:aim.y,r:380,a:1.0*(G.muzzle/0.07)});
  return L;
}

// ---------- 实体绘制 ----------
const PCONF = {
  default:{ shX:17, shY:-98, hipX:9, hipY:-62, torso:[-29,-108,58,58], head:[-22,-152,44,58] },
  brute:  { shX:26, shY:-100, hipX:12, hipY:-62, torso:[-38,-110,76,58], head:[-22,-154,44,58] },
};
function limb(pa,pb,x,y,elbY,a,b){
  ctx.save(); ctx.translate(x,y); ctx.rotate(a);
  ctx.drawImage(pa,-pa.uw/2,-2,pa.uw,pa.uh);
  ctx.translate(0,elbY); ctx.rotate(b);
  ctx.drawImage(pb,-pb.uw/2,-2,pb.uw,pb.uh);
  ctx.restore();
}

function drawZombie(z, t){
  const tp = z.tp;
  const pz = z.civ ? persp(0.5) : persp(z.z);
  const k = pz.k * tp.size;
  const sx = (z.civ ? z.sx : lerp(z.x0, z.xT, z.z)) + G.camX;
  const sy = pz.y + G.camY;
  const dyingP = z.state==='dying' ? Math.min(1, z.t/0.7) : 0;
  const P = PARTS[z.type];
  const C = PCONF[z.type] || PCONF.default;
  // 黑暗中浮现
  const vis = z.civ ? 1 : clamp((z.z-0.05)/0.42, 0.12, 1);

  ctx.save();
  ctx.globalAlpha = 0.42*(1-dyingP)*vis;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx, sy+3*k, 30*k, 7*k, 0, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(k*(z.flip?-1:1), k);
  if (dyingP > 0){
    ctx.globalAlpha = 1 - dyingP;
    ctx.rotate((z.headshot?1:-1) * dyingP * 1.5);
  } else {
    ctx.rotate(Math.sin(z.phase)*(z.civ?0.02:0.045));
  }
  const bob = Math.sin(z.phase*2)*2.4;
  ctx.translate(0, bob);
  const windup = z.state==='windup';
  let filt='';
  if (z.flash>0) filt='brightness(2.3) saturate(0.5)';
  else if (vis<0.97) filt=`brightness(${(0.08+0.92*vis).toFixed(2)})`;
  if (filt){ try{ ctx.filter=filt; }catch(e){} }

  if (windup){
    const rg = ctx.createRadialGradient(0,-85,10,0,-85,95);
    rg.addColorStop(0,'rgba(255,50,32,0.3)'); rg.addColorStop(1,'rgba(255,50,32,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(0,-85,95,0,TAU); ctx.fill();
  }
  // 步态：急起急停的蹒跚
  const s0 = Math.sin(z.phase);
  const lurch = Math.sign(s0)*Math.pow(Math.abs(s0),0.55);
  const swing = z.civ ? Math.sin(z.phase)*0.5 : lurch*0.4;
  const tremor = z.type==='runner' ? Math.sin(t*47+z.gaitSeed)*0.022 : 0;
  const twitchK = z.twitch>0 ? Math.sin(t*72+z.gaitSeed)*z.twitch : 0;
  // 腿
  limb(P.thigh, P.shin, -C.hipX, C.hipY, 30, swing-0.04, clamp(-swing,0,1)*0.55);
  limb(P.thigh, P.shin,  C.hipX, C.hipY, 30, -swing+0.04, clamp(swing,0,1)*0.55);
  // 上半身佝偻前倾（绕髋）
  ctx.save();
  ctx.translate(0,C.hipY);
  ctx.rotate(z.hunch + tremor + twitchK*0.35);
  ctx.translate(0,-C.hipY);
  let aL, aR, eL, eR;
  if (z.civ){
    const wv = Math.sin(t*10)*0.25;
    aL = 2.75+wv; aR = -2.75+wv; eL = -0.3; eR = 0.3;
  } else if (windup){
    const raise = Math.min(1, z.t/0.5);
    aL = 0.9+raise*1.5; aR = -0.9-raise*1.5; eL = -0.5+raise*0.3; eR = 0.5-raise*0.3;
  } else {
    const sway = Math.sin(z.phase*2)*0.1;
    aL = 0.42+sway+(z.hunch*0.8); aR = -0.52+sway; eL = -0.6; eR = 0.5;
  }
  limb(P.uarm, P.farm, -C.shX, C.shY, 26, aL, eL);
  ctx.drawImage(P.torso, C.torso[0], C.torso[1], C.torso[2], C.torso[3]);
  limb(P.uarm, P.farm, C.shX, C.shY, 26, aR, eR);
  // 头（歪斜 + 抽搐）
  if (!(z.state==='dying' && z.headshot)){
    ctx.save();
    const neckY = C.shY-4;
    ctx.translate(0,neckY);
    ctx.rotate(z.headTilt + twitchK*0.8 + (windup?Math.sin(t*30)*0.05:0));
    ctx.translate(0,-neckY);
    ctx.drawImage(z.headC||P.heads[0], C.head[0], C.head[1], C.head[2], C.head[3]);
    ctx.restore();
  } else {
    ctx.fillStyle='#4a0a0a';
    ctx.beginPath(); ctx.ellipse(0,-100,9,5,0,0,TAU); ctx.fill();
  }
  ctx.restore();
  try{ ctx.filter='none'; }catch(e){}
  ctx.restore();

  const fd = z.flip?-1:1;
  const headDx = fd*Math.sin(z.hunch||0)*55*k;
  z.geo = {
    hx: sx + Math.sin(z.phase)*3*k + headDx, hy: sy + (bob-121)*k, hr: 20*k, k,
    bx: sx - 28*k, by: sy - 106*k, bw: 56*k, bh: 84*k,
    glow: (z.civ || z.state==='dying') ? 0 : clamp(1-vis*1.05,0,1)*0.85+0.1,
    eyeC: z.type==='runner' ? '#d08a30' : '#c03a28',
  };
}

function drawHatchet(h){
  if (h.dead) return;
  const q = Math.min(1,h.q);
  const x = lerp(h.x0,h.x1,q)+G.camX, y = lerp(h.y0,h.y1,q*q)+G.camY;
  const s = lerp(h.k0*0.8, 2.6, q);
  ctx.save(); ctx.globalAlpha=0.2;
  ctx.strokeStyle='#b8c2cc'; ctx.lineWidth=2.4*s;
  ctx.beginPath(); ctx.arc(x,y,10*s,h.rot,h.rot+2.4); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(x,y); ctx.rotate(h.rot); ctx.scale(s,s);
  ctx.fillStyle='#4c3a20'; ctx.fillRect(-2,-14,4,26);
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(-1,-12); ctx.lineTo(-1,10); ctx.stroke();
  const mg=ctx.createLinearGradient(-15,-20,-8,-2);
  mg.addColorStop(0,'#b8c2cc'); mg.addColorStop(1,'#5e6872');
  ctx.fillStyle=mg;
  ctx.beginPath(); ctx.moveTo(-2,-14); ctx.lineTo(-15,-19); ctx.lineTo(-12,-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#6e757e';
  ctx.beginPath(); ctx.moveTo(2,-14); ctx.lineTo(9,-16); ctx.lineTo(8,-8); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(74,10,10,0.55)';
  ctx.beginPath(); ctx.moveTo(-14,-17); ctx.lineTo(-12,-6); ctx.lineTo(-9,-8); ctx.closePath(); ctx.fill();
  ctx.restore();
  h.geo = { x, y, r: 17*s };
}

function drawBoss(t){
  const b = G.boss;
  const pz = persp(b.z);
  const k = pz.k * 1.55;
  const sx = W/2 + b.sway + G.camX, sy = pz.y - 6 + G.camY;
  const windP = b.state==='windup' ? Math.min(1,b.t/0.9) : 0;
  const atkP  = b.state==='attack' ? Math.min(1,b.t/0.3) : 0;
  const stag  = b.state==='stagger';
  const deadP = G.state==='bossdie' ? Math.min(1, G.t/2) : 0;
  const vis = clamp((b.z-0.12)/0.4, 0.1, 1);

  ctx.save();
  ctx.globalAlpha=0.45*(1-deadP)*vis;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx, sy+4*k, 64*k, 13*k, 0, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(k,k);
  if (deadP>0){ ctx.globalAlpha = 1-deadP*0.9; ctx.rotate(-deadP*1.2); ctx.translate(0, deadP*60); }
  else if (stag){ ctx.rotate(-0.16 + Math.sin(t*30)*0.02); }
  else { ctx.rotate(Math.sin(t*1.7)*0.03); }
  let bfilt='';
  if ((b.flash||0)>0) bfilt='brightness(2.1) saturate(0.6)';
  else if (vis<0.97) bfilt=`brightness(${(0.08+0.92*vis).toFixed(2)})`;
  if (bfilt){ try{ ctx.filter=bfilt; }catch(e){} }

  ctx.drawImage(BOSSP.leg, -22-15, -76, 30, 84);
  ctx.drawImage(BOSSP.leg,  22-15, -76, 30, 84);
  ctx.save();
  ctx.translate(-60,-172); ctx.rotate(0.22+Math.sin(t*1.7)*0.05);
  ctx.drawImage(BOSSP.armL, -16, -6, 32, 84);
  ctx.restore();
  ctx.drawImage(BOSSP.torso, -75, -206, 150, 184);
  // 心脏（弱点）
  const hb = 1 + 0.16*Math.sin(t*(b.vulnerable?9:5));
  if (b.vulnerable && deadP===0){
    const hg = ctx.createRadialGradient(0,-140,2,0,-140,44);
    hg.addColorStop(0,'rgba(255,60,48,0.8)'); hg.addColorStop(1,'rgba(255,32,24,0)');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,-140,44,0,TAU); ctx.fill();
  }
  ctx.save();
  ctx.translate(0,-140); ctx.scale(hb,hb);
  ctx.fillStyle = b.vulnerable ? '#e83a2e' : '#661a18';
  ctx.beginPath();
  ctx.moveTo(0,14);
  ctx.bezierCurveTo(-17,-4,-13,-19,0,-9);
  ctx.bezierCurveTo(13,-19,17,-4,0,14);
  ctx.fill();
  ctx.strokeStyle='#4a0a08'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(-4,-8); ctx.quadraticCurveTo(-2,0,-5,6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3,-9); ctx.quadraticCurveTo(5,-2,3,4); ctx.stroke();
  ctx.restore();
  // 肋骨栅栏
  ctx.strokeStyle='#b0a68a'; ctx.lineWidth=4;
  for (const rx of [-15,0,15]){
    ctx.beginPath(); ctx.moveTo(rx,-166); ctx.quadraticCurveTo(rx*1.35,-140,rx*1.15,-116); ctx.stroke();
  }
  ctx.strokeStyle='rgba(50,42,34,0.7)'; ctx.lineWidth=1.4;
  for (const rx of [-15,0,15]){
    ctx.beginPath(); ctx.moveTo(rx+2,-166); ctx.quadraticCurveTo(rx*1.35+2,-140,rx*1.15+2,-116); ctx.stroke();
  }
  // 右臂 + 大砍刀
  const armA = stag ? -1.05 : lerp(-0.5, -1.85, windP) + atkP*3.4;
  ctx.save();
  ctx.translate(60,-172); ctx.rotate(armA);
  ctx.drawImage(BOSSP.armR, -17, -8, 34, 82);
  ctx.translate(0,66); ctx.rotate(-0.5);
  ctx.drawImage(BOSSP.cleaver, -28, -6, 56, 118);
  ctx.restore();
  ctx.drawImage(BOSSP.head, -42, -274, 84, 92);
  // 眼缝红光（窄缝比圆点更凶）
  const eg = 0.5+0.5*Math.sin(t*6.5);
  ctx.save(); ctx.globalAlpha = ctx.globalAlpha*(0.45+0.55*eg);
  for (const [dx,rot] of [[-13,-0.18],[13,0.22]]){
    const gg=ctx.createRadialGradient(dx,-226,1,dx,-226,12);
    gg.addColorStop(0,'rgba(255,60,40,0.55)'); gg.addColorStop(1,'rgba(255,30,22,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(dx,-226,12,0,TAU); ctx.fill();
    ctx.fillStyle='#ff3a26';
    ctx.save(); ctx.translate(dx,-226); ctx.rotate(rot);
    ctx.beginPath(); ctx.ellipse(0,0,6,2.2,0,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  try{ ctx.filter='none'; }catch(e){}
  ctx.restore();

  b.geo = {
    heartX: sx, heartY: sy - 140*k, heartR: Math.max(20, 24*k),
    bx: sx-70*k, by: sy-230*k, bw: 140*k, bh: 210*k,
  };
}

// ---------- HUD & 界面 ----------
function txt(s, x, y, size, color, align, weight, font){
  ctx.font = `${weight||'bold'} ${size}px ${font||'"Courier New",ui-monospace,monospace'}`;
  ctx.textAlign = align||'center'; ctx.textBaseline='middle';
  ctx.lineWidth = Math.max(3, size/8); ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineJoin='round';
  ctx.strokeText(s,x,y);
  ctx.fillStyle=color; ctx.fillText(s,x,y);
}
function cnTxt(s,x,y,size,color,align,weight){
  txt(s,x,y,size,color,align,weight,'"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif');
}
function serifTxt(s,x,y,size,color,align){
  txt(s,x,y,size,color,align,'900','Georgia,"Times New Roman",serif');
}

function drawHUD(){
  txt('SCORE '+String(G.score).padStart(7,'0'), 18, 26, 17, '#d5c8a4', 'left');
  for (let i=0;i<G.maxLives;i++){
    const x = W-26-i*26, y = 26;
    ctx.strokeStyle='#3e321c'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(x,y+10); ctx.lineTo(x,y-2); ctx.stroke();
    if (i < G.lives){
      flame(x, y-8, 0.72, G.tGlobal, i*3);
    } else {
      ctx.fillStyle='rgba(110,110,110,0.3)';
      ctx.beginPath(); ctx.arc(x,y-6,3,0,TAU); ctx.fill();
    }
  }
  for (let i=0;i<G.mag;i++){
    const x = 22+i*19, y = H-26;
    if (i < G.ammo){
      ctx.fillStyle='#c2a45e';
      ctx.fillRect(x-4,y-9,8,15);
      ctx.beginPath(); ctx.arc(x,y-9,4,Math.PI,0); ctx.fill();
      ctx.fillStyle='#8a6e34'; ctx.fillRect(x-4,y+3,8,4);
    } else {
      ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1.5;
      ctx.strokeRect(x-4,y-9,8,16);
    }
  }
  if (G.reloading){
    const p = Math.min(1, G.reloadT/0.75);
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(18,H-58,140,10);
    ctx.fillStyle='#d5c8a4'; ctx.fillRect(18,H-58,140*p,10);
    cnTxt('装弹中…',88,H-70,13,'#d5c8a4');
  } else if (G.ammo===0 && (G.state==='play'||G.state==='boss')){
    if (Math.sin(G.tGlobal*10)>0) cnTxt('装弹！RELOAD',110,H-64,16,'#ff6a5e','left');
  }
  const r = RELOAD_BTN;
  ctx.fillStyle='rgba(14,16,22,0.75)';
  ctx.strokeStyle = G.ammo===0 ? '#ff6a5e' : 'rgba(213,200,164,0.55)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.rect(r.x,r.y,r.w,r.h); ctx.fill(); ctx.stroke();
  cnTxt('装弹 [R]', r.x+r.w/2, r.y+r.h/2, 16, G.ammo===0?'#ff6a5e':'#d5c8a4');
  const b = G.boss;
  if (b && (G.state==='boss'||G.state==='bossdie')){
    const bw=430, bx=(W-bw)/2, by=18, cells=20;
    txt('EXECUTIONER', bx-8, by+7, 13, '#e07a68', 'right');
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-3,by-3,bw+6,20);
    const frac = clamp(b.hp/b.max,0,1);
    for (let i=0;i<cells;i++){
      const on = i < Math.ceil(frac*cells);
      ctx.fillStyle = on ? (frac>0.5?'#5fbc5f':frac>0.25?'#cfae42':'#cf5242') : 'rgba(255,255,255,0.08)';
      ctx.fillRect(bx+i*(bw/cells)+1, by, bw/cells-2, 14);
    }
  }
  if (G.msg){
    const m = G.msg, p = Math.min(1, m.t/0.15);
    ctx.save(); ctx.globalAlpha = m.t > m.dur-0.3 ? (m.dur-m.t)/0.3 : 1;
    cnTxt(m.txt, W/2, H*0.34, 30*p+2, m.color);
    if (m.sub) txt(m.sub, W/2, H*0.34+30, 13, 'rgba(255,255,255,0.75)');
    ctx.restore();
  }
  for (const p of G.pops){
    ctx.save(); ctx.globalAlpha = 1 - p.t/0.95;
    cnTxt(p.txt, p.x, p.y - p.t*46, p.big?20:15, p.color);
    ctx.restore();
  }
}

function drawCrosshair(){
  const x=aim.x, y=aim.y;
  if (G.muzzle>0){
    const mp = G.muzzle/0.07;
    ctx.save(); ctx.globalAlpha=mp;
    const g = ctx.createRadialGradient(x,y,2,x,y,34);
    g.addColorStop(0,'rgba(255,235,175,0.9)'); g.addColorStop(1,'rgba(255,150,55,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,34,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = G.ammo===0&&!G.reloading ? '#ff6a5e' : '#e2e4dc';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,13,0,TAU); ctx.stroke();
  ctx.beginPath();
  for (const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
    ctx.moveTo(x+dx*7,y+dy*7); ctx.lineTo(x+dx*18,y+dy*18);
  }
  ctx.stroke();
  ctx.fillStyle='#ff5a4e';
  ctx.beginPath(); ctx.arc(x,y,2,0,TAU); ctx.fill();
}

// ---------- 黑暗 / 光池 / 电影调色 ----------
function applyDarkness(bgIdx){
  let base = BASE_DARK[bgIdx];
  if (G.ltFlash>0) base *= (1-G.ltFlash*0.92);
  if (G.flk>0) base = Math.min(0.85, base + 0.32*Math.abs(Math.sin(G.tGlobal*60))*(G.flk/0.55));
  DARKG.globalCompositeOperation='source-over';
  DARKG.clearRect(0,0,W,H);
  DARKG.fillStyle=`rgba(3,4,8,${base.toFixed(3)})`;
  DARKG.fillRect(0,0,W,H);
  DARKG.globalCompositeOperation='destination-out';
  for (const L of sceneLights(bgIdx)){
    const lx=L.x+G.camX, ly=L.y+G.camY;
    const g=DARKG.createRadialGradient(lx,ly,2,lx,ly,L.r);
    g.addColorStop(0,`rgba(0,0,0,${L.a})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    DARKG.fillStyle=g;
    DARKG.beginPath(); DARKG.arc(lx,ly,L.r,0,TAU); DARKG.fill();
  }
  DARKG.globalCompositeOperation='source-over';
  ctx.drawImage(DARKC,0,0);
}
// 黑暗中的眼睛余光（穿透黑暗层）
function drawEyeGlows(){
  for (const z of G.zombies){
    const g=z.geo; if (!g || !g.glow) continue;
    for (const dx of [-6.5*g.k, 6.5*g.k]){
      const ex=g.hx+dx, ey=g.hy-1;
      ctx.save();
      ctx.globalAlpha = g.glow*(0.7+0.3*Math.sin(G.tGlobal*5+g.hx*0.1));
      const gg=ctx.createRadialGradient(ex,ey,0.5,ex,ey,6*g.k);
      gg.addColorStop(0,g.eyeC); gg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(ex,ey,6*g.k,0,TAU); ctx.fill();
      ctx.fillStyle=g.eyeC;
      ctx.beginPath(); ctx.arc(ex,ey,1.5*g.k,0,TAU); ctx.fill();
      ctx.restore();
    }
  }
}
// 电影级调色：降饱和 + 青灰阴影
function gradeFX(){
  ctx.save();
  ctx.globalCompositeOperation='saturation';
  ctx.fillStyle='rgba(128,128,128,0.35)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle='rgba(162,175,180,0.3)';
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

function drawBattlefield(){
  const bob = G.state==='walk' ? Math.sin(G.t*9)*7 : 0;
  const bgIdx = (G.state==='boss'||G.state==='bossdie') ? 2 : SCENES[G.sceneIdx].bg;
  ctx.save();
  if (G.shake>0) ctx.translate(rand(-G.shake,G.shake), rand(-G.shake,G.shake));
  ctx.translate(0, bob);
  ctx.save(); ctx.translate(G.camX,G.camY);
  BGS[bgIdx](G.tGlobal);
  if (goreC) ctx.drawImage(goreC,0,0);
  ctx.restore();
  // 远处实体 → 深度雾带 → 近处实体
  const ents = [...G.zombies].sort((a,b)=>(a.civ?0.5:a.z)-(b.civ?0.5:b.z));
  for (const z of ents) if ((z.civ?0.5:z.z) < 0.32) drawZombie(z, G.tGlobal);
  drawFog(G.tGlobal*1.35+47, 0.09);
  for (const z of ents) if ((z.civ?0.5:z.z) >= 0.32) drawZombie(z, G.tGlobal);
  if (G.boss && (G.state==='boss'||G.state==='bossdie')) drawBoss(G.tGlobal);
  for (const h of G.hatchets) drawHatchet(h);
  for (const p of G.parts){
    ctx.save(); ctx.globalAlpha = 1-p.t/p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
    ctx.restore();
  }
  if (bgIdx===0){
    ctx.strokeStyle='rgba(150,170,200,0.26)'; ctx.lineWidth=1;
    ctx.beginPath();
    for (const r of rain){
      ctx.moveTo(r.x, r.y); ctx.lineTo(r.x-3, r.y+13);
    }
    ctx.stroke();
  }
  ctx.restore();

  // 黑暗层 + 光池
  applyDarkness(bgIdx);
  drawEyeGlows();
  // 闪电
  if (G.ltFlash>0){
    ctx.fillStyle=`rgba(200,215,255,${G.ltFlash*0.32})`;
    ctx.fillRect(0,0,W,H);
  }
  for (const e of G.effects){
    if (e.type!=='claw') continue;
    const p = e.t/0.4;
    ctx.save(); ctx.globalAlpha = 1-p;
    ctx.fillStyle=`rgba(140,8,8,${0.3*(1-p)})`; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#f2ded6'; ctx.lineWidth=5; ctx.lineCap='round';
    for (let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.moveTo(W*0.28+i*46 - p*40, H*0.16);
      ctx.lineTo(W*0.62+i*46 + p*40, H*0.86);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (G.hurtT>0){
    const g = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.72);
    g.addColorStop(0,'rgba(130,0,0,0)');
    g.addColorStop(1,`rgba(130,0,0,${0.55*G.hurtT})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  if (G.lives===1 && (G.state==='play'||G.state==='boss')){
    const pulse = 0.12+0.1*Math.sin(G.tGlobal*5.5);
    const g = ctx.createRadialGradient(W/2,H/2,H*0.34,W/2,H/2,H*0.75);
    g.addColorStop(0,'rgba(100,0,0,0)'); g.addColorStop(1,`rgba(100,0,0,${pulse})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  gradeFX();
}

// CRT 后处理：暗角 + 胶片噪点 + 扫描线
function crtFX(){
  ctx.drawImage(VIG,0,0);
  ctx.save();
  ctx.globalCompositeOperation='overlay';
  ctx.globalAlpha=0.12;
  const gr=GRAIN[(Math.random()*GRAIN.length)|0];
  const ox=-((Math.random()*160)|0), oy=-((Math.random()*160)|0);
  for (let x=ox;x<W;x+=160) for (let y=oy;y<H;y+=160) ctx.drawImage(gr,x,y);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha=0.55; ctx.fillStyle=SCANPAT;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

// ---------- 各状态渲染 ----------
function render(){
  ctx.clearRect(0,0,W,H);
  switch (G.state){
    case 'title': renderTitle(); break;
    case 'story': renderStory(); break;
    case 'scene_intro':
      drawBattlefield();
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,H*0.36,W,H*0.26);
      cnTxt(SCENES[G.sceneIdx].name, W/2, H*0.46, 34, '#e8d9ae');
      txt(SCENES[G.sceneIdx].sub, W/2, H*0.55, 15, 'rgba(255,255,255,0.7)');
      break;
    case 'walk':
      drawBattlefield();
      if (Math.sin(G.t*7)>0) cnTxt('前 进 ▶', W/2, H*0.5, 30, '#7dffa8');
      break;
    case 'play': case 'boss':
      drawBattlefield(); drawHUD(); drawCrosshair();
      if (G.paused){
        ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
        cnTxt('暂停', W/2, H/2-10, 40, '#e8d9ae');
        cnTxt('按 P 继续', W/2, H/2+34, 16, 'rgba(255,255,255,0.7)');
      }
      break;
    case 'bossdie':
      drawBattlefield(); drawHUD();
      if (G.t>1.7){
        ctx.fillStyle=`rgba(255,255,255,${(G.t-1.7)*2})`; ctx.fillRect(0,0,W,H);
      }
      break;
    case 'bossintro': renderBossIntro(); break;
    case 'continue': renderContinue(); break;
    case 'gameover': renderGameover(); break;
    case 'victory': renderVictory(); break;
  }
  crtFX();
}

// 标题画面里在栅栏后蹒跚而过的剪影
const titleZ = { type:'shambler', tp:TYPES.shambler, x0:0, xT:0, z:0.24, hp:99,
  state:'walk', t:0, phase:0, flash:0, geo:null, headshot:false, flip:false,
  headC:PARTS.shambler.heads[0], hunch:0.18, headTilt:0.12, gaitWarp:1, gaitSeed:0,
  twitch:0, twitchT:99, spd:0, civ:false };

function renderTitle(){
  bgGate(G.tGlobal);
  // 巡游的剪影
  titleZ.phase = G.tGlobal*3.0;
  const tx = ((G.tGlobal*24)%(W+280))-140;
  titleZ.x0 = titleZ.xT = tx - G.camX;
  drawZombie(titleZ, G.tGlobal);
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  if (titleZ.geo && titleZ.geo.glow){
    const g=titleZ.geo;
    for (const dx of [-6.5*g.k, 6.5*g.k]){
      ctx.save(); ctx.globalAlpha=0.8;
      ctx.fillStyle='#c03a28';
      ctx.beginPath(); ctx.arc(g.hx+dx,g.hy-1,1.5*g.k,0,TAU); ctx.fill();
      ctx.restore();
    }
  }
  ctx.strokeStyle='rgba(150,170,200,0.3)'; ctx.lineWidth=1;
  ctx.beginPath();
  for (const r of rain){ ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-3,r.y+13); }
  ctx.stroke();
  if (G.ltFlash>0){ ctx.fillStyle=`rgba(200,215,255,${G.ltFlash*0.3})`; ctx.fillRect(0,0,W,H); }
  serifTxt('THE HOUSE OF', W/2, 104, 36, '#b6bac2');
  serifTxt('THE DEAD', W/2, 170, 74, '#5e0b07');
  serifTxt('THE DEAD', W/2, 166, 74, '#a5170e');
  ctx.fillStyle='#8a130c';
  for (let i=0;i<5;i++){
    const x = W/2-160+i*80;
    const len = 14 + 12*Math.abs(Math.sin(G.tGlobal*0.7+i*2));
    ctx.fillRect(x, 202, 3, len);
    ctx.beginPath(); ctx.arc(x+1.5, 202+len, 3, 0, TAU); ctx.fill();
  }
  cnTxt('复 刻 版 · 第 一 章 「馆」', W/2, 258, 21, '#e8d9ae');
  if (Math.sin(G.tGlobal*4)>-0.2) cnTxt('点 击 开 始', W/2, 334, 26, '#e8e6e0');
  txt('INSERT COIN — FREE PLAY', W/2, 370, 13, 'rgba(255,255,255,0.5)');
  cnTxt('鼠标瞄准 · 左键射击 · R / 右键装弹', W/2, 432, 15, 'rgba(255,255,255,0.75)');
  cnTxt('小心飞斧（可击落）· 不要射击平民 · 爆头有奖励', W/2, 460, 14, 'rgba(213,200,164,0.75)');
  txt('A HOMAGE REMAKE — 1996 SEGA ARCADE CLASSIC', W/2, H-20, 11, 'rgba(255,255,255,0.35)');
  drawCrosshair();
}

function renderStory(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  let remain = Math.floor(G.storyChars);
  let y = H*0.3;
  for (const line of STORY){
    const n = Math.min(line.length, Math.max(0,remain));
    cnTxt(line.slice(0,n), W/2, y, 20, '#cfc8b8', 'center', 'normal');
    remain -= line.length; y += 46;
  }
  if (remain>=0) cnTxt('点击继续 ▶', W/2, H-56, 14, 'rgba(255,255,255,0.5)');
  drawCrosshair();
}

function renderBossIntro(){
  ctx.fillStyle='#040207'; ctx.fillRect(0,0,W,H);
  const p = Math.min(1, G.t/0.8);
  ctx.save(); ctx.globalAlpha = p;
  const flick = 0.75+0.25*Math.sin(G.tGlobal*11);
  txt('— WARNING —', W/2, H*0.2, 22, `rgba(235,55,38,${flick})`);
  txt('TYPE-017', W/2, H*0.34, 17, '#b6bac2');
  cnTxt('刽 子 手', W/2, H*0.46, 52, '#c41d12');
  txt('THE EXECUTIONER', W/2, H*0.57, 19, '#b6bac2');
  ctx.restore();
  if (G.t>1.4){
    if (Math.sin(G.tGlobal*8)>-0.3){
      cnTxt('弱点：心脏', W/2, H*0.74, 26, '#e07a68');
      const hx=W/2+112, hy=H*0.74, s=1+0.15*Math.sin(G.tGlobal*9);
      ctx.save(); ctx.translate(hx,hy); ctx.scale(s,s);
      ctx.fillStyle='#e83a2e';
      ctx.beginPath();
      ctx.moveTo(0,10);
      ctx.bezierCurveTo(-13,-3,-9,-14,0,-7);
      ctx.bezierCurveTo(9,-14,13,-3,0,10);
      ctx.fill(); ctx.restore();
    }
  }
  drawCrosshair();
}

function renderContinue(){
  drawBattlefield();
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
  txt('CONTINUE ?', W/2, H*0.3, 46, '#e8d9ae');
  const n = Math.max(0, Math.ceil(G.continueT)-1);
  txt(String(n), W/2, H*0.5, 78, n<=3?'#c41d12':'#e2e4dc');
  cnTxt('点 击 投 币 继 续', W/2, H*0.68, 22, Math.sin(G.tGlobal*5)>0?'#e2e4dc':'#d5c8a4');
  txt('CREDIT ∞', W/2, H*0.76, 14, 'rgba(255,255,255,0.5)');
  drawCrosshair();
}

function renderGameover(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  serifTxt('GAME OVER', W/2, H*0.4, 62, '#560b06');
  serifTxt('GAME OVER', W/2, H*0.4-3, 62, '#a5170e');
  cnTxt('得分 '+G.score, W/2, H*0.56, 20, '#e8d9ae');
  if (G.t>1) cnTxt('点击返回标题', W/2, H*0.72, 16, 'rgba(255,255,255,0.6)');
  drawCrosshair();
}

function calcRank(){
  const acc = G.shots ? G.hits/G.shots : 0;
  if (G.continues===0 && G.civKilled===0 && acc>=0.75 && G.lives>=4) return 'S';
  if (G.continues===0 && acc>=0.6) return 'A';
  if (G.continues<=1 && acc>=0.45) return 'B';
  if (G.continues<=2) return 'C';
  return 'D';
}
function renderVictory(){
  bgBallroom(G.tGlobal);
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
  const p = Math.min(1, G.t/0.6);
  ctx.save(); ctx.globalAlpha=p;
  cnTxt('第 一 章 完', W/2, 74, 36, '#e8d9ae');
  txt('CHAPTER 1 CLEAR', W/2, 112, 15, 'rgba(255,255,255,0.7)');
  const acc = G.shots ? Math.round(G.hits/G.shots*100) : 0;
  const rows = [
    ['得分 SCORE', String(G.score).padStart(7,'0')],
    ['击杀 KILLS', String(G.kills)],
    ['命中率 ACCURACY', acc+'%'],
    ['救援 RESCUED', String(G.civSaved) + (G.civKilled?`（误伤 ${G.civKilled}）`:'')],
    ['续币 CONTINUES', String(G.continues)],
  ];
  let y = 170;
  for (const [k,v] of rows){
    cnTxt(k, W/2-60, y, 17, 'rgba(255,255,255,0.75)', 'right', 'normal');
    cnTxt(v, W/2+60, y, 19, '#e8d9ae', 'left');
    y += 40;
  }
  ctx.restore();
  if (G.t > 1.2){
    const rp = Math.min(1,(G.t-1.2)/0.25);
    const scale = 3-2*rp;
    ctx.save();
    ctx.translate(W/2+250, 250); ctx.rotate(-0.2); ctx.scale(scale,scale);
    ctx.globalAlpha = rp;
    txt('RANK', 0, -46, 16, '#e07a68');
    serifTxt(calcRank(), 0, 14, 86, '#c41d12');
    ctx.strokeStyle='#c41d12'; ctx.lineWidth=5;
    ctx.strokeRect(-52,-74,104,128);
    ctx.restore();
    if (rp>=1 && !G.rankStamped){ G.rankStamped = true; addShake(6); sfx.boom(); }
  }
  if (G.t>2) cnTxt('点击返回标题', W/2, H-40, 16, Math.sin(G.tGlobal*4)>0?'#e2e4dc':'rgba(255,255,255,0.5)');
  drawCrosshair();
}

// ---------- 输入 ----------
function toGame(e){
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX-r.left)*W/r.width, y: (e.clientY-r.top)*H/r.height };
}
cvs.addEventListener('pointermove', e=>{
  const p = toGame(e); aim.x=p.x; aim.y=p.y;
});
cvs.addEventListener('pointerdown', e=>{
  e.preventDefault(); audioInit();
  if (actx && actx.state==='suspended') actx.resume();
  const p = toGame(e); aim.x=p.x; aim.y=p.y;
  if (e.button===2){ if (G.state==='play'||G.state==='boss') startReload(); return; }
  handleClick(p.x,p.y);
});
cvs.addEventListener('contextmenu', e=>e.preventDefault());

function handleClick(x,y){
  switch (G.state){
    case 'title':
      resetRun(); G.storyChars=0; setState('story'); sfx.coin(); break;
    case 'story': {
      const total = STORY.reduce((a,l)=>a+l.length,0);
      if (G.storyChars < total) G.storyChars = total;
      else startScene(0);
      break;
    }
    case 'scene_intro': startWave(); break;
    case 'bossintro': if (G.t>0.8) initBoss(); break;
    case 'play': case 'boss': {
      if (G.paused) { G.paused=false; return; }
      const r = RELOAD_BTN;
      if (x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h){ startReload(); return; }
      shoot(x,y);
      break;
    }
    case 'continue':
      G.continues++; G.lives=5; G.ammo=G.mag; G.reloading=false;
      for (const z of G.zombies){ if (!z.civ && z.state!=='dying'){ z.state='dying'; z.t=0; } }
      G.hatchets.length=0;
      if (G.boss){ G.boss.state='expose'; G.boss.t=0; G.boss.struck=false; setState('boss'); }
      else setState('play');
      sfx.coin(); say('行动继续！','CONTINUE',1.2,'#7dffa8');
      break;
    case 'gameover': case 'victory':
      if (G.t>1){ G.rankStamped=false; setState('title'); }
      break;
  }
}
addEventListener('keydown', e=>{
  audioInit();
  if (e.code==='KeyR'){ if (G.state==='play'||G.state==='boss') startReload(); }
  else if (e.code==='KeyM'){ muted=!muted; say(muted?'静音':'声音开启','',0.8); }
  else if (e.code==='KeyP' || e.code==='Escape'){
    if (G.state==='play'||G.state==='boss') G.paused=!G.paused;
  }
  else if (e.code==='Enter' || e.code==='Space'){
    if (G.state==='title'||G.state==='story'||G.state==='gameover'||G.state==='victory') handleClick(W/2,H/2);
  }
});
addEventListener('blur', ()=>{ if (G.state==='play'||G.state==='boss') G.paused=true; });

// ---------- 主循环 ----------
let last = performance.now();
function frame(ts){
  const dt = Math.min(0.05, (ts-last)/1000 || 0.016);
  last = ts;
  for (const r of rain){
    r.y += r.s*(dt||0.016); r.x -= 60*dt;
    if (r.y>H){ r.y=-14; r.x=rand(0,W+80); }
  }
  for (const m of motes){
    m.x += m.vx*dt; m.y += m.vy*dt;
    if (m.x<0) m.x=W; if (m.x>W) m.x=0;
    if (m.y<130) m.y=420; if (m.y>430) m.y=140;
  }
  if (!G.paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
